<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Game Manager</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.24);
      --accent: #b91c1c;
      --accent-ink: #ffe4e6;
      --soft: rgba(185, 28, 28, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.35;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; color: inherit; touch-action: manipulation; background: none; border: 0; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
    input { font: inherit; color: inherit; }

    .num-face {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .name, .who, .game-name {
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .at-bat .name { font-weight: 600; }

    .wrap {
      width: min(480px, 100%);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 12px 0;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      padding-bottom: 8px;
    }
    header { display: flex; align-items: center; gap: 8px; min-height: 44px; }
    header h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header p, .hint, .note { margin: 0; color: var(--muted); font-size: 0.82rem; font-weight: 400; }
    .grow { flex: 1; min-width: 0; }
    .back {
      min-height: 44px;
      min-width: 44px;
      padding: 0 8px 0 0;
      color: #cbd5e1;
      font-weight: 500;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      flex: none;
    }
    .team-select {
      width: 100%;
      min-height: 44px;
      margin: 8px 0 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: 8px 12px;
      font-weight: 500;
    }
    h2 {
      margin: 12px 0 6px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .game-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      width: 100%;
      min-height: 64px;
      padding: 12px 14px;
      margin: 0 0 8px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      text-align: left;
      color: inherit;
    }
    .game-top { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
    .game-btn strong { flex: 1; min-width: 0; font-size: 1rem; font-weight: 600; }
    .game-btn .meta { color: var(--muted); font-weight: 400; font-size: 0.82rem; }
    .game-btn.live { border-color: rgba(185, 28, 28, 0.55); }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex: none;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 6px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .board-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0b1220;
    }
    .board {
      display: grid;
      grid-template-columns: 4.6rem repeat(var(--n), minmax(1.7rem, 1fr)) 1.7rem 1.7rem 1.7rem;
      min-width: 100%;
    }
    .who, .inn, .run, .run-h, .he {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      background: transparent;
      color: inherit;
      padding: 0;
    }
    .who { justify-content: flex-start; padding: 0 8px; font-size: 0.78rem; }
    .head { border-top: 0; min-height: 24px; color: var(--muted); font-size: 0.72rem; }
    .run, .run-h, .he { border-left: 1px solid rgba(148, 163, 184, 0.28); background: #0b1220; }
    .he { font-size: 0.85rem; }
    .run { font-size: 1.05rem; }
    .inn { font-size: 0.95rem; }
    .inn.now { background: rgba(185, 28, 28, 0.2); color: var(--accent-ink); box-shadow: inset 0 -2px 0 #fecaca; }
    .batting { background: rgba(185, 28, 28, 0.1); }
    .inn.skip { color: #fda4af; }
    .who { background: #0b1220; }
    .batting.who, .batting.run, .batting.he { background: #2a1218; }

    .banner {
      margin-top: 8px;
      min-height: 40px;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .banner p { margin: 0; font-weight: 500; }
    .banner .half { font-size: 0.95rem; }
    .banner .role { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .banner.offense { background: rgba(185, 28, 28, 0.2); color: var(--accent-ink); }
    .banner.defense { background: rgba(185, 28, 28, 0.08); color: var(--ink); border: 1px solid rgba(185, 28, 28, 0.35); }
    .banner.final { background: var(--card); border: 1px solid var(--line); }
    .banner.final .role { text-transform: none; letter-spacing: 0; font-size: 0.95rem; font-weight: 600; }
    .half-num { font-size: 1.15rem; }
    .outs { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .out-marks { display: flex; gap: 4px; }
    .mark { width: 9px; height: 9px; border-radius: 99px; background: rgba(226, 232, 240, 0.28); display: block; }
    .mark.on { background: #fff; }
    .banner.defense .mark.on { background: var(--accent); }
    .outs-label { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.88rem; }
    .tiebreaker {
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      border-radius: 12px;
      border: 1px solid rgba(185, 28, 28, 0.45);
      background: var(--soft);
      color: var(--accent-ink);
      font-weight: 500;
      text-align: left;
      padding: 0 12px;
    }

    .order { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
    .row { display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid rgba(148, 163, 184, 0.14); }
    .row:last-child { border-bottom: 0; }
    .row-hit {
      flex: 1; min-width: 0; min-height: 44px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 8px 0 10px; text-align: left; color: inherit;
    }
    .row .num { width: 1.4rem; flex: none; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
    .at-bat { box-shadow: inset 3px 0 0 var(--accent); background: rgba(185, 28, 28, 0.1); }
    .at-bat .num { color: var(--accent-ink); font-weight: 600; }
    .is-selected { background: rgba(148, 163, 184, 0.08); }
    .due { margin-left: auto; flex: none; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-ink); }
    .due.later { color: var(--muted); font-weight: 500; }
    .role-tag, .cr-tag { flex: none; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.03em; color: var(--accent-ink); }
    .sub-btn {
      min-height: 44px; min-width: 64px; margin-right: 6px;
      border-radius: 10px; border: 1px solid var(--line); background: #111827;
      font-weight: 500;
    }
    .field { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .pos-btn {
      min-height: 52px; min-width: 0; padding: 6px 8px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); color: inherit;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-align: left;
    }
    .pos-btn .pos { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
    .pos-btn .name { width: 100%; font-size: 0.78rem; }
    .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .toggle {
      min-height: 44px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); color: #cbd5e1; font-size: 0.85rem; font-weight: 500;
    }
    .toggle.on { border-color: rgba(185, 28, 28, 0.7); background: var(--soft); color: var(--accent-ink); }
    .track { display: flex; align-items: center; gap: 8px; min-height: 36px; border-top: 1px solid rgba(148, 163, 184, 0.14); }
    .track b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
    .spot { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    .innings-fold { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 0 12px 4px; }
    .innings-fold summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; }

    .dock {
      position: sticky; bottom: 0; z-index: 4; margin-top: auto;
      padding: 8px 0 calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 75%, rgba(2, 6, 23, 0));
      display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px;
    }
    .dock .end-half, .dock .menu-link, .dock.solo .primary { grid-column: 1 / -1; }
    .dock.solo { grid-template-columns: 1fr; }
    .primary {
      min-height: 56px; border-radius: 16px; background: var(--accent); color: #fff;
      font-size: 1.15rem; font-weight: 600;
    }
    .quiet {
      min-height: 48px; border-radius: 12px; background: var(--card);
      border: 1px solid var(--line); color: var(--ink); font-weight: 500;
    }
    .quiet:disabled { opacity: 0.38; }
    .danger {
      min-height: 44px; color: #fecaca; font-weight: 600; background: transparent;
    }
    .menu-link {
      min-height: 44px; color: #fecaca; font-weight: 600; font-size: 0.9rem;
      text-align: right;
    }

    .sheet {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(2, 6, 23, 0.72);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 12px;
    }
    .sheet-card {
      width: min(420px, 100%);
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 24px;
      padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: min(88dvh, 720px);
      overflow: auto;
    }
    .sheet-card h2 { margin: 0 0 6px; font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; text-transform: none; color: #f8fafc; }
    #sub-effect { margin: 8px 0 12px; font-size: 1rem; font-weight: 500; line-height: 1.35; }
    .run-num { margin: 4px 0 8px; text-align: center; font-size: 3.2rem; line-height: 0.95; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pad button, .stepper button {
      min-height: 48px; min-width: 44px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--bg); color: #f8fafc;
      font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; margin: 12px 0; }
    .stepper p { margin: 0; text-align: center; font-weight: 600; }
    .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); margin: 10px 0; }
    .segment button { min-height: 44px; border-radius: 10px; color: #cbd5e1; font-weight: 500; }
    .segment button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
    .big {
      width: 100%; min-height: 48px; margin-top: 8px; border-radius: 14px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem;
    }
    .big.plain { background: #1e293b; color: var(--ink); }
    .big.danger { background: transparent; color: #fecaca; border: 1px solid rgba(252, 165, 165, 0.45); }
    .big:disabled { opacity: 0.4; }
    .pick {
      width: 100%; min-height: 48px; margin: 0 0 8px; padding: 8px 12px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
      text-align: left; font-weight: 500;
    }
    .lineup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
    .mini { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 28px; border-top: 1px solid rgba(148, 163, 184, 0.14); }
    .mini .pos { flex: none; min-width: 1.5rem; color: var(--muted); font-size: 0.75rem; font-weight: 600; }
    .mini .name { flex: 1; font-size: 0.8rem; }
    .empty, .subs, .final-note { margin: 8px 0; color: #cbd5e1; font-weight: 400; border: 0; background: transparent; padding: 0; }
    .form-error { margin: 8px 0 0; color: #fecaca; font-weight: 500; font-size: 0.9rem; }
    .sync { margin: 2px 0 0; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .sync.saving, .sync.offline { color: var(--accent-ink); }
    .sync-notice { margin: 6px 0 0; padding: 6px 8px; border-radius: 10px; background: var(--soft); color: var(--accent-ink); font-weight: 500; }
    .text-input {
      width: 100%; min-height: 44px; margin: 8px 0; border-radius: 12px;
      border: 1px solid var(--line); background: var(--bg); padding: 8px 12px; font-size: 16px;
    }
    .winner { font-weight: 600; }

  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../shared/elks-data.js"></script>
  <script src="../shared/game-manager.js"></script>
  <script src="../shared/game-sync.js"></script>
  <script>
    var STORAGE_KEY = (window.GameManager && GameManager.STORAGE_KEY) || "mn-elks-game-manager-v1";
    var sync = null;
    var lineupCache = { teams: {} };
    var applyingLocal = false;
    var teamId = "";
    var teamName = "Us";
    var view = "list";
    var gameId = "";
    var sheet = "";
    var pickPos = "";
    var runDigits = "";
    var plannedInnings = 7;
    var subSpot = 0;
    var pendingSub = null;
    var effectText = "";
    var courtesyFor = "";
    var illegalReason = "";
    var selectedId = "";
    var plannedSide = "away";
    var errorText = "";
    var oppDraft = "";
    var dpDraft = "";
    var flexDraft = "";
    var endReason = "time";
    var editAt = null;
    var loadNote = "";
    var booting = true;
    var loadToken = 0;

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function currentTeam() {
      var hub = window.HUB_SOFTBALL || {};
      var raw = hub.teamId || "";
      var name = hub.teamName || "Team";
      var club = hub.clubName || "";
      if (window.ElksData && ElksData.currentHubTeam) {
        var team = ElksData.currentHubTeam();
        raw = team.id || raw;
        name = team.name || name;
        club = team.clubName || club;
      }
      var id = raw;
      if (window.ElksData && ElksData.canonicalTeamId) id = ElksData.canonicalTeamId(raw) || raw;
      return { id: id || "team", rawId: raw, name: name, clubName: club };
    }

    function teamLabel(team) {
      return [team.clubName, team.name].filter(Boolean).join(" ") || "Us";
    }

    function pinRealTeam() {
      var team = currentTeam();
      if (team.id && team.id !== "all" && team.id !== "unassigned" && team.id !== "team") return team;
      var teams = teamChoices().filter(function (item) {
        return item && item.id && item.id !== "all" && item.id !== "unassigned";
      });
      if (!teams.length) return team;
      if (window.ElksData && ElksData.setCurrentHubTeam) ElksData.setCurrentHubTeam(teams[0].id);
      team = currentTeam();
      if (!team.id || team.id === "all" || team.id === "unassigned" || team.id === "team") {
        return {
          id: teams[0].id,
          rawId: teams[0].id,
          name: teams[0].name || "Team",
          clubName: teams[0].clubName || "",
        };
      }
      return team;
    }

    function teamChoices() {
      var hub = window.HUB_SOFTBALL || {};
      return Array.isArray(hub.teams) ? hub.teams : [];
    }

    function doc() {
      return sync ? sync.display() : GameManager.emptyDocument();
    }

    function cachePack() {
      if (!lineupCache.teams) lineupCache.teams = {};
      if (!lineupCache.teams[teamId]) {
        lineupCache.teams[teamId] = { teamName: teamName, games: [], players: [] };
      }
      lineupCache.teams[teamId].teamName = teamName || lineupCache.teams[teamId].teamName;
      return lineupCache.teams[teamId];
    }

    function saveCache() {
      if (sync) sync.setCache(lineupCache);
    }

    function bundle() {
      var cache = cachePack();
      var live = (doc().teams && doc().teams[teamId]) || { sessions: {} };
      return {
        teamName: cache.teamName,
        games: cache.games,
        players: cache.players,
        sessions: live.sessions || {},
      };
    }

    function syncChip() {
      if (!sync) return "";
      var kind = sync.status();
      var note = sync.notice();
      return '<p id="sync-status" class="sync ' + esc(kind) + '">' + esc(sync.statusLabel()) + "</p>"
        + (note ? '<p id="sync-notice" class="sync-notice">' + esc(note) + "</p>" : "");
    }

    function tap(op) {
      var session = sessionFor(gameId);
      var next = Object.assign({ teamId: teamId, teamName: teamName, gameId: gameId }, op);
      if (session && next.type !== "start" && next.type !== "set-active" && next.type !== "undo" && next.type !== "resume") {
        next.atHalf = { inningIndex: session.inningIndex, half: session.half, outs: GameManager.clampOuts(session.outs) };
      }
      try {
        dryRun(next);
      } catch (e) {
        errorText = e && e.message ? e.message : "That did not work.";
        render();
        return null;
      }
      errorText = "";
      applyingLocal = true;
      try {
        return sync.run(next);
      } finally {
        applyingLocal = false;
      }
    }

    function dryRun(op) {
      GameManager.applyGameOp(doc(), Object.assign({ teamId: teamId, teamName: teamName, gameId: gameId }, op));
    }

    function sessionFor(id) {
      var found = bundle().sessions[id];
      return found || null;
    }

    function findGame(id) {
      var games = bundle().games || [];
      for (var i = 0; i < games.length; i += 1) {
        if (games[i] && games[i].id === id) return games[i];
      }
      var session = sessionFor(id);
      return (session && session.lineupSnapshot) || null;
    }

    function gamesForList() {
      var pack = bundle();
      var games = (pack.games || []).slice();
      var ids = {};
      games.forEach(function (game) { if (game && game.id) ids[game.id] = true; });
      Object.keys(pack.sessions || {}).forEach(function (id) {
        var session = pack.sessions[id];
        if (session && session.status === "live" && !ids[id]) {
          games.push(session.lineupSnapshot || { id: id, name: session.gameName || "Game", battingOrder: [] });
        }
      });
      return games;
    }

    function readLegacyLineup(id) {
      try {
        var key = id ? "mn-elks-lineup-v1:" + id : "mn-elks-lineup-v1";
        var saved = localStorage.getItem(key);
        if (!saved && id === "team-16u-fransen") saved = localStorage.getItem("mn-elks-lineup-v1");
        return saved ? JSON.parse(saved) : null;
      } catch (e) {
        return null;
      }
    }

    function rosterFrom(state, games) {
      var rawPlayers = state && Array.isArray(state.players) ? state.players : [];
      var list = [];
      if (window.ElksData && ElksData.playersForTeam && ElksData.toLineupPlayer) {
        try {
          list = ElksData.playersForTeam(state, teamId).map(function (player) {
            return GameManager.slimPlayer(ElksData.toLineupPlayer(player));
          }).filter(Boolean);
        } catch (e) {
          list = [];
        }
      }
      if (!list.length) list = GameManager.playersOnTeam(rawPlayers, teamId);
      var have = {};
      list.forEach(function (player) { have[player.id] = true; });
      var needed = {};
      (games || []).forEach(function (game) {
        (game.battingOrder || []).forEach(function (id) { needed[String(id)] = true; });
        (game.unavailableIds || []).forEach(function (id) { needed[String(id)] = true; });
        (game.inningDefenses || []).forEach(function (row) {
          Object.keys(row || {}).forEach(function (pos) {
            if (row[pos]) needed[String(row[pos])] = true;
          });
        });
        Object.keys(game.defensivePositions || {}).forEach(function (pos) {
          if (game.defensivePositions[pos]) needed[String(game.defensivePositions[pos])] = true;
        });
      });
      rawPlayers.forEach(function (player) {
        var slim = GameManager.slimPlayer(player);
        if (!slim || have[slim.id] || !needed[slim.id]) return;
        list.push(slim);
        have[slim.id] = true;
      });
      return list;
    }

    function namedSession(session) {
      if (!session) return session;
      var byId = {};
      (session.players || []).forEach(function (player) { byId[player.id] = player; });
      (bundle().players || []).forEach(function (player) { byId[player.id] = player; });
      var players = Object.keys(byId).map(function (id) { return byId[id]; });
      return Object.assign({}, session, { players: players });
    }

    function cell(value) {
      if (value === "X") return "X";
      return typeof value === "number" ? String(value) : "";
    }

    function scoreboardHtml(state) {
      var board = GameManager.scoreboard(state);
      var rows = GameManager.scoreboardRows(state);
      var n = Math.max(1, board.innings.length);
      var batting = state && state.status === "live" ? (state.half === "bottom" ? "home" : "away") : "";
      function cells(row, header) {
        return board.innings.map(function (inn, index) {
          var shown = header ? String(inn.inning) : cell(row.cells[index]);
          var cls = "inn num-face" + (header ? " head" : "") + (inn.current ? " now" : "") + (!header && shown === "X" ? " skip" : "");
          if (!header && row.side === batting) cls += " batting";
          var tie = !header && ((row.side === "away" && inn.topTiebreaker) || (row.side === "home" && inn.bottomTiebreaker));
          if (tie) cls += " tie";
          if (header || shown === "") return '<div class="' + cls + '">' + esc(shown) + "</div>";
          var half = row.side === "away" ? "top" : "bottom";
          return '<button type="button" class="' + cls + '" data-action="edit-cell" data-inning="' + index + '" data-half="' + half + '" aria-label="Edit ' + esc(half) + " " + inn.inning + '">' + esc(shown) + "</button>";
        }).join("");
      }
      function teamLine(row) {
        var bat = row.side === batting ? " batting" : "";
        return '<div class="who' + bat + '" data-side="' + esc(row.side) + '" title="' + esc(row.name || row.label) + '">' + esc(row.label) + "</div>"
          + cells(row, false)
          + '<div class="run num-face' + bat + '">' + row.total + "</div>"
          + '<div class="he hits num-face' + bat + '">' + (row.hits || 0) + "</div>"
          + '<div class="he errs num-face' + bat + '">' + (row.errors || 0) + "</div>";
      }
      var headNums = board.innings.map(function (inn) {
        return '<div class="inn num-face head' + (inn.current ? " now" : "") + '">' + inn.inning + "</div>";
      }).join("");
      return '<div class="board-scroll" id="scoreboard" aria-label="Line score, away team on top">'
        + '<div class="board" style="--n:' + n + '">'
        + '<div class="who head"></div>' + headNums
        + '<div class="run-h num-face head">R</div><div class="he head">H</div><div class="he head">E</div>'
        + teamLine(rows[0]) + teamLine(rows[1])
        + "</div></div>";
    }

    function bannerHtml(state) {
      var board = GameManager.scoreboard(state);
      if (state.status !== "live") {
        var banner = GameManager.finalBanner(state);
        return '<div id="half-indicator" class="banner final"><p class="half">' + esc(banner) + '</p><p class="role">' + esc(GameManager.scoreLine(state)) + "</p></div>";
      }
      var parts = board.label.split(" ");
      var word = parts[0] || "Top";
      var num = parts[1] || "";
      var role = board.role === "defense" ? "Defense" : "Offense";
      var extra = board.extra ? '<span class="extra">Extra</span> ' : "";
      return '<div id="half-indicator" class="banner ' + board.role + '"><p class="half">' + extra + esc(word) + ' <span class="half-num num-face">' + esc(num) + '</span></p><p class="role">' + role + "</p>" + outsHtml(state) + "</div>";
    }

    function outsHtml(session) {
      var outs = GameManager.clampOuts(session.outs);
      var dots = [0, 1, 2].map(function (index) {
        return '<i class="mark' + (index < outs ? " on" : "") + '"></i>';
      }).join("");
      var label = outs === 1 ? "1 out" : outs + " outs";
      return '<div id="outs" class="outs" aria-label="' + esc(label) + '"><span class="out-marks">' + dots + '</span><span class="outs-label">' + esc(label) + "</span></div>";
    }

    function tiebreakerHtml(session) {
      if (!GameManager.tiebreakerActive(session) && !session.tiebreaker) return "";
      var runner = GameManager.itbRunner(session);
      var text = runner && runner.id ? "Tiebreaker · " + runner.label + " on 2nd" : "Tiebreaker · runner on 2nd";
      return '<button type="button" id="tiebreaker" class="tiebreaker" data-action="change-runner" aria-pressed="true">' + esc(text) + "</button>";
    }

    function trackerRows(state, playedOnly) {
      var rows = GameManager.defensiveInningRows(namedSession(state));
      if (playedOnly) rows = rows.filter(function (row) { return row.outs > 0; });
      if (!rows.length) return '<p class="empty">No defensive innings yet.</p>';
      return rows.map(function (row) {
        return '<div class="track"><span>' + esc(row.label) + "</span>"
          + (row.position ? '<span class="spot">' + esc(row.position) + "</span>" : "")
          + "<b>" + esc(row.innings) + "</b></div>";
      }).join("");
    }

    function trackerHtml(state, folded) {
      var body = trackerRows(state, !folded);
      if (folded) {
        return '<details id="defensive-innings" class="innings-fold"><summary>Defensive innings</summary>' + body + "</details>";
      }
      return '<section id="defensive-innings"><h2>Defensive innings</h2>' + body + "</section>";
    }

    function battingOrderHtml(session) {
      var rowsIn = GameManager.liveBatters(session);
      if (!rowsIn.length) return '<h2 id="batting-order">Batting order</h2><p class="empty">No batting order in this lineup.</p>';
      var tags = ["Due up", "On deck", "In the hole"];
      var dueAt = GameManager.dueSlots(rowsIn.length, GameManager.effectiveBatterIndex(session));
      var tagFor = {};
      dueAt.forEach(function (index, nth) { tagFor[index] = tags[nth]; });
      var canSub = session.battingMode && session.battingMode !== "roster";
      var courtesy = courtesyList(session);
      var rows = rowsIn.map(function (row, index) {
        var tagName = tagFor[index] || "";
        var tag = tagName ? '<span class="due' + (tagName === "Due up" ? "" : " later") + '">' + tagName + "</span>" : "";
        var role = row.role ? '<span class="role-tag">' + esc(row.role) + "</span>" : "";
        var cr = courtesy.filter(function (item) { return item.forId === row.id || item.runnerId === row.id; })[0];
        var crTag = cr ? '<span class="cr-tag">CR ' + esc(playerName(session, cr.runnerId)) + "</span>" : "";
        var picked = row.id === selectedId;
        var sub = picked && canSub ? '<button type="button" class="sub-btn" data-action="ask-sub" data-spot="' + index + '">Sub</button>' : "";
        var leave = picked && session.battingMode === "roster"
          ? '<button type="button" class="sub-btn" data-action="ask-leave" data-player="' + esc(row.id) + '">Leaves</button>'
          : "";
        var cls = "row" + (tagName === "Due up" ? " at-bat" : "") + (picked ? " is-selected" : "");
        return '<div class="' + cls + '"><button type="button" class="row-hit" data-action="select-player" data-player="' + esc(row.id) + '" data-spot="' + index + '">'
          + '<span class="num">' + row.order + '</span><span class="name">' + esc(row.label) + "</span>" + role + crTag + tag
          + "</button>" + sub + leave + "</div>";
      }).join("");
      var wrap = '<p id="due-wrap" hidden></p>';
      return '<h2 id="batting-order">Batting order</h2>' + wrap + cardNote(session)
        + '<div class="toggles"><button type="button" class="toggle" id="courtesy-runner" data-action="ask-courtesy">Courtesy runner</button>'
        + '<button type="button" class="toggle" data-action="next-batter">Next Batter</button></div>'
        + swapButton(session) + '<div class="order">' + rows + "</div>";
    }

    function defenseEditorHtml(session) {
      var rows = GameManager.defenseRows(session.defense, session.players).filter(function (row) {
        return GameManager.FIELD_POSITIONS.indexOf(row.pos) >= 0;
      });
      var defense = rows.map(function (row) {
        return '<button type="button" class="pos-btn" data-action="pick-defense" data-pos="' + esc(row.pos) + '">'
          + '<span class="pos">' + esc(row.pos) + '</span><span class="name">' + esc(row.label) + "</span></button>";
      }).join("");
      var flexSub = session.battingMode === "dp-flex" && !session.flexLeft && !session.flexBatting
        ? '<button type="button" class="quiet" id="sub-for-flex" data-action="ask-flex-sub">Sub for FLEX</button>'
        : "";
      var flexBack = session.battingMode === "dp-flex" && session.flexLeft
        ? '<button type="button" class="quiet" id="flex-return" data-action="flex-return">FLEX re-enters</button>'
        : "";
      return "<h2>Defense</h2>"
        + cardNote(session)
        + swapButton(session)
        + flexSub
        + flexBack
        + '<div class="field">' + defense + "</div>";
    }

    function cardNote(session) {
      if (!session || session.battingMode !== "dp-flex") return "";
      if (session.flexBatting || session.flexLeft) return '<p class="hint" id="card-size">Lineup is 9.</p>';
      return '<p class="hint" id="card-size">10 on the card. 9 bat.</p>';
    }

    function playerName(session, id) {
      var player = (session.players || []).filter(function (item) { return item.id === id; })[0];
      return GameManager.playerLabel(player || { id: id, name: "Player" });
    }

    function swapButton(session) {
      if (!session || session.battingMode !== "dp-flex" || !session.dpId) return "";
      return '<button type="button" class="quiet" id="swap-dp-flex" data-action="swap-dp-flex">'
        + (session.flexBatting ? "DP bats again" : "FLEX bats for DP") + "</button>";
    }

    function courtesyList(session) {
      var raw = session && session.courtesy;
      if (Array.isArray(raw)) return raw;
      if (raw && raw.forId) return [raw];
      return [];
    }

    function errorHtml() {
      return errorText ? '<p class="form-error" id="form-error">' + esc(errorText) + "</p>" : "";
    }

    function listMeta(game, session) {
      if (session && session.status === "live") return GameManager.liveScoreMeta(session);
      var count = (game.battingOrder || []).length;
      if (!count) return "No batting order yet";
      return count === 1 ? "1 batter" : count + " batters";
    }

    function headerHtml(title, sub, backLabel) {
      return "<header>"
        + '<button type="button" class="back" data-action="back">‹ ' + esc(backLabel) + "</button>"
        + '<div class="grow"><h1>' + esc(title) + "</h1>" + (sub ? "<p>" + esc(sub) + "</p>" : "") + syncChip() + "</div>"
        + "</header>";
    }

    function teamSelectHtml() {
      var teams = teamChoices();
      if (teams.length < 2) return "";
      var current = currentTeam();
      var options = teams.map(function (team) {
        var selected = team.id === current.rawId || team.id === current.id ? " selected" : "";
        var label = (team.clubName ? team.clubName + " · " : "") + team.name;
        return '<option value="' + esc(team.id) + '"' + selected + ">" + esc(label) + "</option>";
      }).join("");
      return '<label class="hint" for="team-select">Team</label><select id="team-select" class="team-select">' + options + "</select>";
    }

    function renderList() {
      var pack = bundle();
      var waiting = GameManager.unplayedGames(gamesForList(), pack.sessions);
      var played = GameManager.playedEntries(pack.games, pack.sessions);
      var games = waiting.length
        ? waiting.map(function (game) {
          var session = pack.sessions[game.id];
          var live = session && session.status === "live";
          return '<button type="button" class="game-btn' + (live ? " live" : "") + '" data-action="open-game" data-game="' + esc(game.id) + '">'
            + '<span class="game-top"><strong class="game-name">' + esc(game.name || "Game") + "</strong>"
            + (live ? '<span class="pill live">Live</span>' : "") + "</span>"
            + '<span class="meta">' + esc(listMeta(game, session)) + "</span></button>";
        }).join("")
        : '<p class="empty">No games waiting. Build one in Lineup Builder, then come back.</p>';
      var playedHtml = played.length
        ? "<h2>Played</h2>" + played.map(function (row) {
          var game = row.game;
          var session = row.session;
          return '<button type="button" class="game-btn" data-action="open-played" data-game="' + esc(session.lineupGameId) + '">'
            + "<strong>" + esc((game && game.name) || session.gameName || "Game") + "</strong>"
            + "<span>" + esc(GameManager.finalScoreMeta(session)) + "</span></button>";
        }).join("")
        : "";
      return '<div class="wrap" data-screen="list">'
        + headerHtml("Game Manager", "", "Hub")
        + teamSelectHtml()
        + (loadNote ? '<p class="note">' + esc(loadNote) + "</p>" : "")
        + (booting && !(pack.games || []).length ? '<p class="empty">Loading lineups…</p>' : games)
        + playedHtml
        + (sync && sync.status && sync.status() === "offline" ? '<p class="hint">Offline. This phone will catch up.</p>' : "")
        + "</div>";
    }

    function miniList(rows, emptyText) {
      if (!rows.length) return '<p class="hint">' + esc(emptyText) + "</p>";
      return rows.map(function (row) {
        var tag = row.order ? String(row.order) : (row.pos || "");
        var role = row.role ? '<span class="role-tag">' + esc(row.role) + "</span>" : "";
        return '<div class="mini"><span class="pos">' + esc(tag) + '</span><span class="name">' + esc(row.label) + "</span>" + role + "</div>";
      }).join("");
    }

    function renderDetail() {
      var game = findGame(gameId);
      if (!game) return renderList();
      var lineup = GameManager.lineupView(game, bundle().players);
      var field = (lineup.defense || []).filter(function (row) {
        return GameManager.FIELD_POSITIONS.indexOf(row.pos) >= 0;
      });
      var subs = lineup.subs.length
        ? lineup.subs.map(function (row) { return esc(row.label); }).join(", ")
        : "No subs.";
      var out = lineup.out.length ? '<p class="hint">Out: ' + lineup.out.map(function (row) { return esc(row.label); }).join(", ") + "</p>" : "";
      var flexLine = lineup.flexLabel ? '<p class="hint" id="flex-note">Flex: ' + esc(lineup.flexLabel) + ". Defense only, unless she bats in the DP's spot or the DP takes her position.</p>" : "";
      return '<div class="wrap" data-screen="detail">'
        + headerHtml(lineup.name, teamName, "Games")
        + '<p class="chip" id="lineup-format">' + esc(lineup.formatLabel || "Continuous order") + "</p>"
        + "<main>"
        + '<div class="lineup-grid">'
        + '<section class="panel"><h2>Batting order</h2>' + miniList(lineup.batting, "No batting order yet.") + "</section>"
        + '<section class="panel"><h2>Defense</h2>' + miniList(field, "No defensive lineup yet.") + "</section>"
        + "</div>"
        + '<h2>Subs</h2><p class="subs">' + subs + "</p>"
        + flexLine
        + out
        + ""
        + "</main>"
        + '<div class="dock solo"><button type="button" class="primary" id="start-game" data-action="ask-side">Start Game</button></div>'
        + sideSheet()
        + "</div>";
    }

    function renderLive() {
      var session = namedSession(sessionFor(gameId));
      if (!session || session.status !== "live") return renderList();
      var onDefense = GameManager.roleFor(session.side, session.half) === "defense";
      var format = GameManager.formatInfo(session.battingMode);
      return '<div class="wrap" data-screen="live">'
        + '<div class="topbar">'
        + headerHtml(session.gameName, GameManager.opponentLabel(session.gameName) ? "vs " + GameManager.opponentLabel(session.gameName) : "", "Games")
        + scoreboardHtml(session)
        + bannerHtml(session)
        + tiebreakerHtml(session)
        + errorHtml()
        + "</div>"
        + "<main>"
        + (onDefense
          ? defenseEditorHtml(session) + trackerHtml(session, true)
          : battingOrderHtml(session))
        + "</main>"
        + '<div class="dock">'
        + '<button type="button" class="quiet" id="undo-out" data-action="undo"' + (!(session.history && session.history.length) ? " disabled" : "") + ">Undo</button>"
        + '<button type="button" class="primary" id="add-out" data-action="add-out">+1 Out</button>'
        + '<button type="button" class="quiet" data-action="add-run">+ Run</button>'
        + '<button type="button" class="menu-link" data-action="open-menu">Game menu</button>'
        + '<button type="button" class="quiet end-half" data-action="ask-runs">End Half</button>'
        + "</div>"
        + gameMenu(session)
        + leaveSheet(session)
        + editSheet(session)
        + finalConfirmSheet(session)
        + promptSheet(session)
        + confirmHalfSheet(session)
        + runSheet(session)
        + endSheet(session)
        + pickSheet(session)
        + subSheet(session)
        + courtesySheet(session)
        + flexSubSheet(session)
        + confirmSubSheet()
        + illegalSheet()
        + "</div>";
    }

    function subSheet(session) {
      if (sheet !== "sub") return "";
      var options = (session.players || []).filter(function (player) {
        return GameManager.subChoice(session, subSpot, player.id).ok || GameManager.subChoice(session, subSpot, player.id).illegal;
      });
      var buttons = options.map(function (player) {
        var choice = GameManager.subChoice(session, subSpot, player.id);
        var note = choice.illegal ? " · Illegal" : choice.kind === "reenter" ? " · Re-enter" : "";
        return '<button type="button" class="pick" data-action="pick-sub" data-player="' + esc(player.id) + '">'
          + esc(GameManager.playerLabel(player) + note) + "</button>";
      }).join("");
      return '<div class="sheet" id="sub-sheet"><div class="sheet-card"><h2>Sub this spot</h2>'
        + '<p class="hint">Next you will see what this does to the batting order and the defense.</p>'
        + (buttons || '<p class="empty">No one can enter this spot.</p>')
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button></div></div>';
    }

    function leaveSheet(session) {
      if (sheet !== "leave") return "";
      return '<div class="sheet" id="leave-sheet"><div class="sheet-card" role="dialog">'
        + "<h2>Leaves</h2>"
        + '<button type="button" class="pick" data-action="leave-reason" data-reason="skip">Injured. Skip her spot, no out</button>'
        + '<button type="button" class="pick" data-action="leave-reason" data-reason="auto-out">Left early. Out each time</button>'
        + '<button type="button" class="pick" data-action="leave-reason" data-reason="ejected">Ejected. Out each time</button>'
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button></div></div>';
    }

    function editSheet() {
      if (sheet !== "edit" || !editAt) return "";
      var shown = runDigits === "" ? "–" : runDigits;
      return '<div class="sheet" id="edit-sheet"><div class="sheet-card" role="dialog"><h2>Edit half</h2>'
        + '<p class="run-num num-face">' + esc(shown) + "</p>"
        + '<button type="button" class="big" data-action="save-edit"' + (runDigits === "" ? " disabled" : "") + ">Save</button>"
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button></div></div>';
    }

    function finalConfirmSheet(session) {
      if (sheet !== "final-confirm") return "";
      return '<div class="sheet" id="final-confirm"><div class="sheet-card" role="dialog"><h2>That\'s the game</h2>'
        + "<p>" + esc(GameManager.scoreLine(session)) + "</p>"
        + '<button type="button" class="big" data-action="confirm-final">Final</button>'
        + '<button type="button" class="big plain" data-action="undo">Undo</button></div></div>';
    }

    function promptSheet(session) {
      if (sheet !== "prompt" || !session || !session.prompt) return "";
      var title = session.prompt === "walk-off" ? "Walk-off: end the game?" : "Run rule: end the game?";
      return '<div class="sheet"><div class="sheet-card" role="dialog"><h2>' + title + "</h2>"
        + '<button type="button" class="big" data-action="confirm-end">End Game</button>'
        + '<button type="button" class="big plain" data-action="close-sheet">Keep playing</button></div></div>';
    }

    function courtesySheet(session) {
      if (sheet !== "courtesy" && sheet !== "courtesy-runner") return "";
      if (sheet === "courtesy") {
        var record = GameManager.liveBatters(session).filter(function (row) {
          return GameManager.courtesyChoice(session, row.id, "x").reason !== "A courtesy runner is only for the pitcher or catcher."
            || true;
        });
        var card = (session.lineupSnapshot && session.lineupSnapshot.defensivePositions) || {};
        var ids = [];
        if (session.inningIndex === 0 && session.half === "top") {
          if (card.P) ids.push(card.P);
          if (card.C) ids.push(card.C);
        } else {
          if (session.defense && session.defense.P) ids.push(session.defense.P);
          if (session.defense && session.defense.C) ids.push(session.defense.C);
        }
        var batters = GameManager.liveBatters(session).filter(function (row) {
          return ids.indexOf(row.id) >= 0;
        }).map(function (row) {
          return '<button type="button" class="pick" data-action="courtesy-for" data-player="' + esc(row.id) + '">'
            + esc(row.order + " " + row.label) + "</button>";
        }).join("");
        return '<div class="sheet" id="courtesy-sheet"><div class="sheet-card"><h2>Courtesy runner for</h2>'
          + batters
          + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button></div></div>';
      }
      var runners = (session.players || []).map(function (player) {
        return '<button type="button" class="pick" data-action="courtesy-runner" data-player="' + esc(player.id) + '">'
          + esc(GameManager.playerLabel(player)) + "</button>";
      }).join("");
      return '<div class="sheet" id="courtesy-sheet"><div class="sheet-card"><h2>Who runs?</h2>' + runners
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button></div></div>';
    }

    function flexSubSheet(session) {
      if (sheet !== "flex-sub") return "";
      var buttons = (session.players || []).filter(function (player) {
        return player.id !== session.flexId && player.id !== session.dpId;
      }).map(function (player) {
        return '<button type="button" class="pick" data-action="pick-flex-sub" data-player="' + esc(player.id) + '">'
          + esc(GameManager.playerLabel(player)) + "</button>";
      }).join("");
      return '<div class="sheet" id="flex-sub-sheet"><div class="sheet-card"><h2>Sub for Flex</h2>'
        + '<p class="hint">Defense only. She does not bat.</p>' + buttons
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button></div></div>';
    }

    function confirmSubSheet() {
      if (sheet !== "confirm-sub") return "";
      return '<div class="sheet" id="sub-confirm"><div class="sheet-card">'
        + "<h2>Check this change</h2>"
        + '<p id="sub-effect">' + esc(effectText || "") + "</p>"
        + '<button type="button" class="big" id="confirm-sub" data-action="confirm-sub">Confirm</button>'
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button>'
        + "</div></div>";
    }

    function illegalSheet() {
      if (sheet !== "illegal") return "";
      return '<div class="sheet" id="illegal-sheet"><div class="sheet-card">'
        + "<h2>Illegal re-entry</h2>"
        + "<p>" + esc(illegalReason || "That player cannot legally come back.") + "</p>"
        + '<p id="sub-effect">' + esc(effectText || "") + "</p>"
        + '<button type="button" class="big" id="force-sub" data-action="force-sub">Enter anyway</button>'
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button>'
        + "</div></div>";
    }

    function renderPlayed() {
      var session = namedSession(sessionFor(gameId));
      if (!session) return renderList();
      var format = GameManager.formatInfo(session.battingMode);
      return '<div class="wrap" id="ended-summary" data-screen="played">'
        + '<div class="topbar">'
        + headerHtml(session.gameName, "Final · " + format.label, "Games")
        + scoreboardHtml(session)
        + bannerHtml(session)
        + "</div>"
        + "<main>"
        + '<p class="final-note" id="final-note">' + esc(GameManager.finalBanner(session)) + " · " + esc(GameManager.scoreLine(session))
        + (GameManager.endNote(session) ? " · " + esc(GameManager.endNote(session)) : "") + "</p>"
        + '<button type="button" class="quiet" data-action="resume">Resume Game</button>'
        + trackerHtml(session, false)
        + "</main>"
        + "</div>";
    }

    function sideSheet() {
      if (sheet !== "side") return "";
      var game = findGame(gameId);
      var awayOn = plannedSide !== "home";
      var opp = oppDraft || (game ? GameManager.opponentLabel(game.name) : "");
      var dpPick = "";
      if (game && game.battingMode === "dp-flex" && !GameManager.createLiveGame) dpPick = "";
      var needDp = game && game.battingMode === "dp-flex";
      if (needDp) {
        var players = bundle().players || [];
        dpPick = '<p class="hint">Who is the DP? Who is the FLEX?</p>'
          + players.map(function (player) {
            return '<button type="button" class="pick' + (dpDraft === player.id ? " on" : "") + '" data-action="set-dp" data-player="' + esc(player.id) + '">DP · ' + esc(GameManager.playerLabel(player)) + "</button>";
          }).join("")
          + players.map(function (player) {
            return '<button type="button" class="pick' + (flexDraft === player.id ? " on" : "") + '" data-action="set-flex" data-player="' + esc(player.id) + '">FLEX · ' + esc(GameManager.playerLabel(player)) + "</button>";
          }).join("");
      }
      return '<div class="sheet" id="side-sheet" data-screen="side"><div class="sheet-card" role="dialog" aria-modal="true">'
        + "<h2>Start game</h2>"
        + errorHtml()
        + '<label class="hint" for="opp-name">Opponent</label>'
        + '<input id="opp-name" class="text-input" data-field="opp" value="' + esc(opp) + '" maxlength="40">'
        + '<div class="stepper"><button type="button" data-action="set-innings" data-delta="-1" aria-label="Fewer innings">−</button>'
        + '<p id="inning-count"><span class="num-face">' + plannedInnings + "</span> " + (plannedInnings === 1 ? "inning" : "innings") + "</p>"
        + '<button type="button" data-action="set-innings" data-delta="1" aria-label="More innings">+</button></div>'
        + '<div class="segment" role="group" aria-label="Our side">'
        + '<button type="button" data-action="pick-side" data-side="away" aria-pressed="' + (awayOn ? "true" : "false") + '">Away</button>'
        + '<button type="button" data-action="pick-side" data-side="home" aria-pressed="' + (awayOn ? "false" : "true") + '">Home</button>'
        + "</div>"
        + dpPick
        + '<button type="button" class="big" data-action="choose-side" data-side="' + (awayOn ? "away" : "home") + '">Start game</button>'
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button>'
        + "</div></div>";
    }

    function gameMenu(session) {
      if (sheet !== "menu") return "";
      return '<div class="sheet" id="game-menu"><div class="sheet-card" role="dialog" aria-modal="true">'
        + "<h2>Game</h2>"
        + '<button type="button" class="pick" data-action="time-limit">Time limit: finish this inning</button>'
        + '<button type="button" class="pick" data-action="add-tally" data-kind="hit">+ Hit</button>'
        + '<button type="button" class="pick" data-action="add-tally" data-kind="error">+ Error</button>'
        + '<button type="button" class="pick danger" id="end-game" data-action="ask-end">End Game</button>'
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button>'
        + "</div></div>";
    }

    function confirmHalfSheet(session) {
      if (sheet !== "confirm-half") return "";
      var prompt = GameManager.thirdOutPrompt(session);
      var title = prompt ? prompt.title : "End this half?";
      return '<div class="sheet" id="confirm-half-sheet"><div class="sheet-card">'
        + "<h2 id=\"confirm-half-title\">" + esc(title) + "</h2>"
        + '<p class="hint">Three outs. Confirm to enter the runs for this half.</p>'
        + '<button type="button" class="big" id="confirm-half" data-action="confirm-half">Confirm</button>'
        + '<button type="button" class="big plain" id="cancel-third-out" data-action="cancel-third-out">Cancel</button>'
        + "</div></div>";
    }

    function runSheet(session) {
      if (sheet !== "runs") return "";
      var board = GameManager.scoreboard(session);
      var who = board.role === "offense" ? "Runs we scored" : "Runs they scored";
      var shown = runDigits === "" ? "–" : runDigits;
      var countLabel = runDigits === "1" ? "1 run" : (runDigits || "0") + " runs";
      var early = session && GameManager.clampOuts(session.outs) < 3;
      var enter = runDigits === ""
        ? '<button type="button" class="big" disabled>Save runs</button>'
        : '<button type="button" class="big" data-action="commit-runs">Save · ' + esc(countLabel) + "</button>";
      var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "Del"].map(function (key) {
        return '<button type="button" data-action="run-key" data-key="' + esc(key) + '">' + esc(key) + "</button>";
      }).join("");
      return '<div class="sheet" id="run-sheet"><div class="sheet-card">'
        + "<h2>" + esc(board.label) + "</h2>"
        + '<p class="hint">' + esc(who) + (early ? ". End this half with " + GameManager.clampOuts(session.outs) + (GameManager.clampOuts(session.outs) === 1 ? " out?" : " outs?") : "") + "</p>"
        + '<p class="run-num" id="run-digits">' + esc(shown) + "</p>"
        + '<div class="pad">' + keys + "</div>"
        + enter
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button>'
        + "</div></div>";
    }

    function endSheet(session) {
      if (sheet !== "end") return "";
      var reasons = [
        ["run-rule", "Run rule"],
        ["time", "Time limit"],
        ["called", "Called"],
        ["forfeit", "Forfeit"],
        ["other", "Other"],
      ];
      var chips = reasons.map(function (pair) {
        return '<button type="button" class="toggle' + (endReason === pair[0] ? " on" : "") + '" data-action="pick-reason" data-reason="' + pair[0] + '">' + pair[1] + "</button>";
      }).join("");
      return '<div class="sheet" id="end-sheet"><div class="sheet-card" role="dialog" aria-modal="true">'
        + "<h2>End Game</h2>"
        + "<p>" + esc(GameManager.scoreLine(session)) + "</p>"
        + '<p class="hint">Runs in this half so far</p>'
        + '<p class="run-num num-face" id="end-runs">' + esc(String(session.liveRuns || 0)) + "</p>"
        + '<div class="toggles">' + chips + "</div>"
        + errorHtml()
        + '<button type="button" class="big danger" id="confirm-end-game" data-action="confirm-end">End Game</button>'
        + '<button type="button" class="big plain" data-action="close-sheet">Keep playing</button>'
        + "</div></div>";
    }

    function pickSheet(session) {
      if (sheet !== "pick") return "";
      var current = session.defense && session.defense[pickPos] ? String(session.defense[pickPos]) : "";
      var options = (session.players || []).filter(function (player) {
        return GameManager.playerMayField(session, player.id);
      }).sort(function (a, b) {
        return GameManager.playerLabel(a).localeCompare(GameManager.playerLabel(b));
      });
      var buttons = '<button type="button" class="pick" data-action="assign" data-player="">Empty</button>'
        + options.map(function (player) {
          var here = GameManager.defenseRows(session.defense, session.players).filter(function (row) {
            return row.id === player.id && GameManager.FIELD_POSITIONS.indexOf(row.pos) >= 0;
          })[0];
          var extra = here ? " · " + here.pos : "";
          var mark = player.id === current ? " · this spot" : "";
          return '<button type="button" class="pick" data-action="assign" data-player="' + esc(player.id) + '">'
            + esc(GameManager.playerLabel(player) + extra + mark) + "</button>";
        }).join("");
      return '<div class="sheet" id="defense-picker"><div class="sheet-card">'
        + "<h2>" + esc(pickPos) + "</h2>"
        + '<p class="hint">Who is playing here?</p>'
        + buttons
        + '<button type="button" class="big plain" data-action="close-sheet">Cancel</button>'
        + "</div></div>";
    }

    function render() {
      var root = document.getElementById("root");
      if (!window.GameManager) {
        root.innerHTML = '<div class="wrap"><p class="empty">Game Manager could not load.</p></div>';
        return;
      }
      var html = view === "detail" ? renderDetail() : view === "live" ? renderLive() : view === "played" ? renderPlayed() : renderList();
      root.innerHTML = html;
      var nowCell = document.querySelector("#scoreboard .inn.now");
      if (nowCell && nowCell.scrollIntoView) nowCell.scrollIntoView({ inline: "center", block: "nearest" });
    }

    function openGame(id) {
      gameId = id;
      sheet = "";
      var session = sessionFor(id);
      if (session && session.status === "live") {
        view = "live";
        tap({ type: "set-active", gameId: id });
      } else if (session && session.status === "played") {
        view = "played";
      } else {
        view = "detail";
      }
      render();
      window.scrollTo(0, 0);
    }

    function stageChange(change) {
      var effect = GameManager.describeChange(sessionFor(gameId), change);
      if (!effect.ok && !effect.illegal) {
        errorText = effect.reason || "That change is not allowed.";
        sheet = "";
        render();
        return;
      }
      errorText = "";
      pendingSub = change;
      effectText = effect.text || "";
      illegalReason = effect.reason || "";
      sheet = effect.illegal ? "illegal" : "confirm-sub";
      render();
    }

    function applyPending(force) {
      if (!pendingSub) return;
      var change = pendingSub;
      var op = null;
      if (change.type === "bat") op = { type: "sub", spot: change.spot, playerId: change.playerId, force: !!force };
      else if (change.type === "field") op = { type: "set-defense", position: change.position, playerId: change.playerId || "" };
      else if (change.type === "flex") op = { type: "swap-dp-flex", force: !!force };
      else if (change.type === "leave") op = { type: "leave", playerId: change.playerId, reason: change.reason || "auto-out" };
      else if (change.type === "courtesy") op = { type: "courtesy", forId: change.forId, runnerId: change.runnerId };
      else if (change.type === "flex-sub") op = { type: "flex-sub", playerId: change.playerId, force: !!force };
      else if (change.type === "flex-return") op = { type: "flex-return", force: !!force };
      else return;
      try {
        dryRun(op);
      } catch (e) {
        return;
      }
      pendingSub = null;
      effectText = "";
      sheet = "";
      tap(op);
      render();
    }

    function onClick(event) {
      var button = event.target.closest("[data-action]");
      if (!button) return;
      var action = button.getAttribute("data-action");
      if (action === "back") {
        if (sheet) {
          sheet = "";
          runDigits = "";
          render();
          return;
        }
        if (view === "list") {
          window.location.href = "/";
          return;
        }
        if (view === "live") tap({ type: "set-active", gameId: "" });
        view = "list";
        sheet = "";
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (action === "open-game" || action === "open-played") {
        openGame(button.getAttribute("data-game"));
        return;
      }
      if (action === "ask-side") {
        sheet = "side";
        render();
        return;
      }
      if (action === "close-sheet") {
        sheet = "";
        runDigits = "";
        pendingSub = null;
        effectText = "";
        courtesyFor = "";
        render();
        return;
      }
      if (action === "pick-side") {
        plannedSide = button.getAttribute("data-side") === "home" ? "home" : "away";
        render();
        return;
      }
      if (action === "set-dp") { dpDraft = button.getAttribute("data-player"); render(); return; }
      if (action === "set-flex") { flexDraft = button.getAttribute("data-player"); render(); return; }
      if (action === "choose-side") {
        var game = findGame(gameId);
        if (!game) return;
        var oppInput = document.getElementById("opp-name");
        if (oppInput) oppDraft = oppInput.value;
        if (game.battingMode === "dp-flex" && (!dpDraft || !flexDraft)) {
          errorText = "Pick the DP and the FLEX before the game starts.";
          render();
          return;
        }
        var input = {
          side: button.getAttribute("data-side"),
          game: game,
          players: bundle().players,
          teamName: teamName,
          scheduledInnings: plannedInnings,
          oppName: oppDraft,
          dpId: dpDraft,
          flexId: flexDraft,
        };
        var session = GameManager.createLiveGame(input);
        gameId = session.lineupGameId;
        view = "live";
        sheet = "";
        tap({ type: "start", input: input, gameId: session.lineupGameId });
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (action === "add-out") {
        var beforeOuts = GameManager.clampOuts(sessionFor(gameId).outs);
        tap({ type: "add-out" });
        var withOut = sessionFor(gameId);
        if (beforeOuts < 3 && withOut && GameManager.clampOuts(withOut.outs) === 3) sheet = "confirm-half";
        render();
        return;
      }
      if (action === "ask-sub") {
        subSpot = parseInt(button.getAttribute("data-spot"), 10) || 0;
        sheet = "sub";
        render();
        return;
      }
      if (action === "pick-sub") {
        stageChange({ type: "bat", spot: subSpot, playerId: button.getAttribute("data-player") });
        return;
      }
      if (action === "confirm-sub") {
        applyPending(false);
        return;
      }
      if (action === "force-sub") {
        applyPending(true);
        return;
      }
      if (action === "swap-dp-flex") {
        stageChange({ type: "flex" });
        return;
      }
      if (action === "toggle-injury") {
        var injuryOn = !sessionFor(gameId).injuryOut;
        try { dryRun({ type: "injury", on: injuryOn }); } catch (e) { return; }
        tap({ type: "injury", on: injuryOn });
        render();
        return;
      }
      if (action === "ask-leave") {
        selectedId = button.getAttribute("data-player");
        sheet = "leave";
        render();
        return;
      }
      if (action === "leave-reason") {
        stageChange({ type: "leave", playerId: selectedId, reason: button.getAttribute("data-reason") });
        return;
      }
      if (action === "select-player") {
        var picked = button.getAttribute("data-player");
        selectedId = selectedId === picked ? "" : picked;
        render();
        return;
      }
      if (action === "next-batter") {
        tap({ type: "next-batter" });
        render();
        return;
      }
      if (action === "add-run") {
        tap({ type: "add-run" });
        var prompted = sessionFor(gameId);
        if (prompted && prompted.prompt) sheet = "prompt";
        render();
        return;
      }
      if (action === "add-tally") {
        var side = GameManager.roleFor(sessionFor(gameId).side, sessionFor(gameId).half) === "offense" ? "us" : "opp";
        if (button.getAttribute("data-kind") === "error") side = side === "us" ? "opp" : "us";
        tap({ type: "add-tally", kind: button.getAttribute("data-kind"), side: side });
        render();
        return;
      }
      if (action === "undo") {
        tap({ type: "undo" });
        sheet = "";
        render();
        return;
      }
      if (action === "open-menu") { sheet = "menu"; render(); return; }
      if (action === "time-limit") {
        var live = sessionFor(gameId);
        tap({ type: "set-innings", innings: live.inningIndex + 1, timeLimit: true });
        sheet = "";
        render();
        return;
      }
      if (action === "pick-reason") { endReason = button.getAttribute("data-reason"); render(); return; }
      if (action === "edit-cell") {
        editAt = { inningIndex: parseInt(button.getAttribute("data-inning"), 10), half: button.getAttribute("data-half") };
        runDigits = "";
        sheet = "edit";
        render();
        return;
      }
      if (action === "resume") {
        tap({ type: "resume" });
        view = "live";
        render();
        return;
      }
      if (action === "ask-courtesy") {
        sheet = "courtesy";
        render();
        return;
      }
      if (action === "courtesy-for") {
        courtesyFor = button.getAttribute("data-player");
        sheet = "courtesy-runner";
        render();
        return;
      }
      if (action === "courtesy-runner") {
        stageChange({ type: "courtesy", forId: courtesyFor, runnerId: button.getAttribute("data-player") });
        return;
      }
      if (action === "ask-flex-sub") {
        sheet = "flex-sub";
        render();
        return;
      }
      if (action === "pick-flex-sub") {
        stageChange({ type: "flex-sub", playerId: button.getAttribute("data-player") });
        return;
      }
      if (action === "flex-return") {
        stageChange({ type: "flex-return" });
        return;
      }
      if (action === "confirm-half") {
        sheet = "runs";
        runDigits = "";
        render();
        return;
      }
      if (action === "cancel-third-out") {
        sheet = "";
        tap({ type: "undo-out" });
        render();
        return;
      }
      if (action === "undo-out") {
        tap({ type: "undo-out" });
        var fewer = sessionFor(gameId);
        if (sheet === "runs" && fewer && GameManager.clampOuts(fewer.outs) < 3) sheet = "";
        render();
        return;
      }
      if (action === "ask-runs") {
        sheet = "runs";
        runDigits = "";
        render();
        return;
      }
      if (action === "run-key") {
        var key = button.getAttribute("data-key");
        if (key === "C") runDigits = "";
        else if (key === "Del" || key === "⌫") runDigits = runDigits.slice(0, -1);
        else if (runDigits.length < 2) runDigits += key;
        render();
        return;
      }
      if (action === "commit-runs") {
        var preview;
        try {
          preview = GameManager.recordRuns(sessionFor(gameId), runDigits, Date.now());
        } catch (e) {
          errorText = e && e.message ? e.message : "Enter the runs.";
          render();
          return;
        }
        if (preview.status === "played") {
          sheet = "final-confirm";
          render();
          return;
        }
        tap({ type: "record-runs", runs: runDigits });
        sheet = "";
        runDigits = "";
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (action === "confirm-final") {
        tap({ type: "record-runs", runs: runDigits });
        var ended = sessionFor(gameId);
        sheet = "";
        runDigits = "";
        if (ended && ended.status === "played") view = "played";
        render();
        return;
      }
      if (action === "save-edit") {
        if (!editAt) return;
        tap({ type: "edit-half", inningIndex: editAt.inningIndex, half: editAt.half, runs: runDigits });
        sheet = "";
        runDigits = "";
        editAt = null;
        render();
        return;
      }
      if (action === "set-innings") {
        var delta = parseInt(button.getAttribute("data-delta"), 10) || 0;
        plannedInnings = GameManager.clampScheduledInnings(plannedInnings + delta);
        render();
        return;
      }
      if (action === "toggle-tiebreaker") {
        var tieOn = !sessionFor(gameId).tiebreaker;
        try { dryRun({ type: "tiebreaker", on: tieOn }); } catch (e) { return; }
        tap({ type: "tiebreaker", on: tieOn });
        render();
        return;
      }
      if (action === "pick-defense") {
        pickPos = button.getAttribute("data-pos");
        sheet = "pick";
        render();
        return;
      }
      if (action === "assign") {
        stageChange({ type: "field", position: pickPos, playerId: button.getAttribute("data-player") || "" });
        return;
      }
      if (action === "ask-end") {
        sheet = "end";
        render();
        return;
      }
      if (action === "confirm-end") {
        var ending = sessionFor(gameId);
        var ran = tap({
          type: "end",
          reason: endReason,
          runsThisHalf: ending && ending.liveRuns ? ending.liveRuns : 0,
          forfeitWinner: "us",
        });
        if (!ran && errorText) { render(); return; }
        view = "played";
        sheet = "";
        render();
        window.scrollTo(0, 0);
      }
    }

    function onChange(event) {
      if (!event.target || event.target.id !== "team-select") return;
      if (window.ElksData && ElksData.setCurrentHubTeam) ElksData.setCurrentHubTeam(event.target.value);
      var team = currentTeam();
      teamId = team.id;
      teamName = teamLabel(team);
      view = "list";
      sheet = "";
      gameId = "";
      render();
      loadLineups();
    }

    async function loadLineups() {
      var token = ++loadToken;
      var requested = teamId;
      var remote = null;
      var failed = false;
      try {
        var response = await fetch("/api/softball/state", { cache: "no-store" });
        if (!response.ok) failed = true;
        else {
          var data = await response.json();
          if (!data || !data.state) failed = true;
          else remote = data.state;
        }
      } catch (e) {
        failed = true;
      }
      if (token !== loadToken || requested !== teamId) return;
      booting = false;
      var pack = cachePack();
      if (remote) {
        var record = GameManager.selectLineupRecord(remote.lineups, teamId);
        var games = GameManager.gamesFromLineupRecord(record);
        if (!games.length) games = GameManager.gamesFromLineupRecord(readLegacyLineup(teamId));
        pack.games = games;
        pack.players = rosterFrom(remote, games);
        pack.teamName = teamName;
        loadNote = "";
        saveCache();
      } else if (failed) {
        if (!(pack.games || []).length) {
          var legacy = GameManager.gamesFromLineupRecord(readLegacyLineup(teamId));
          if (legacy.length) {
            pack.games = legacy;
            saveCache();
          }
        }
        loadNote = (pack.games || []).length
          ? "Offline. Showing lineups saved on this phone."
          : "No signal. Open this page once while online, then it keeps working.";
      }
      var activeDoc = doc();
      if (activeDoc.active && activeDoc.active.teamId === teamId && view === "list") {
        var active = (activeDoc.teams[teamId] && activeDoc.teams[teamId].sessions[activeDoc.active.gameId]) || null;
        if (active && active.status === "live") {
          gameId = active.lineupGameId;
          view = "live";
        }
      }
      render();
    }

    function cacheShell() {
      if (!("caches" in window)) return;
      caches.open("game-manager-shell-v1").then(function (cache) {
        return cache.addAll(["/apps/game-manager", "/shared/game-manager.js", "/shared/game-sync.js", "/shared/elks-data.js"]);
      }).catch(function () {});
    }

    function registerSw() {
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.register("/game-manager-sw.js").catch(function () {});
    }

    function followRemote() {
      if (applyingLocal) return;
      if (view === "live" || view === "played") {
        var session = sessionFor(gameId);
        if (!session) {
          view = "list";
          sheet = "";
        } else if (view === "live" && session.status === "played") {
          view = "played";
          sheet = "";
        }
      }
      render();
    }

    function boot() {
      if (!window.GameManager || !window.GameSync) {
        render();
        return;
      }
      sync = GameSync.connect({
        storage: window.localStorage,
        storageKey: STORAGE_KEY,
        normalize: GameManager.normalizeDocument,
        applyOp: GameManager.applyGameOp,
        legacyEnvelope: GameManager.envelopeFromLegacy,
        bindWindow: true,
        load: async function () {
          var response = await fetch("/api/softball/game-sessions", { cache: "no-store" });
          if (!response.ok) throw new Error("Could not load Game Manager.");
          var data = await response.json();
          return { document: data.document };
        },
        save: async function (expectedRevision, document) {
          var response = await fetch("/api/softball/game-sessions", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ expectedRevision: expectedRevision, document: document }),
          });
          var data = await response.json().catch(function () { return {}; });
          if (response.status === 409) return { conflict: true, document: data.document };
          if (!response.ok) throw new Error(data.error || "Could not save Game Manager.");
          return { document: data.document };
        },
        subscribe: function (onRevision, onState) {
          var cfg = window.HUB_GAME_SYNC || {};
          if (cfg.anonKey && cfg.url && cfg.clubId && window.GameSync && GameSync.openBroadcast) {
            return GameSync.openBroadcast({
              url: cfg.url,
              anonKey: cfg.anonKey,
              topic: "game-manager:" + cfg.clubId,
              onRevision: onRevision,
              onState: onState,
            });
          }
          var source = new EventSource("/api/softball/game-sessions/stream");
          source.addEventListener("revision", function (event) {
            try {
              var payload = JSON.parse(event.data);
              if (payload && typeof payload.revision === "number") onRevision(payload.revision);
            } catch (e) {}
          });
          source.onopen = function () { if (onState) onState(true); };
          source.onerror = function () { if (onState) onState(false); };
          return function () { source.close(); };
        },
      });
      lineupCache = sync.getCache() || { teams: {} };
      sync.onChange(followRemote);
      var team = pinRealTeam();
      teamId = team.id;
      teamName = teamLabel(team);
      var activeDoc = doc();
      if (activeDoc.active && activeDoc.active.teamId === teamId) {
        var active = (activeDoc.teams[teamId] && activeDoc.teams[teamId].sessions[activeDoc.active.gameId]) || null;
        if (active && active.status === "live") {
          gameId = active.lineupGameId;
          view = "live";
        }
      }
      render();
      sync.start();
      loadLineups();
      cacheShell();
      registerSw();
    }

    document.addEventListener("click", onClick);
    document.addEventListener("change", onChange);
    window.addEventListener("pagehide", function () {
      if (sync) sync.persist();
    });
    boot();
  </script>
</body>
</html>
