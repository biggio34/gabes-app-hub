<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Game Manager</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.24);
      --accent: #b91c1c;
      --accent-ink: #ffe4e6;
      --soft: rgba(185, 28, 28, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.35;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; color: inherit; touch-action: manipulation; background: none; border: 0; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
    input { font: inherit; color: inherit; }

    .num-face {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .name, .who, .game-name {
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .at-bat .name { font-weight: 600; }

    .wrap {
      width: min(480px, 100%);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 12px 0;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      padding-bottom: 8px;
    }
    header { display: flex; align-items: center; gap: 8px; min-height: 44px; }
    header h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header h1.team-title {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      font-size: 0.95rem;
      line-height: 1.25;
    }
    header p, .hint, .note { margin: 0; color: var(--muted); font-size: 0.82rem; font-weight: 400; }
    .grow { flex: 1; min-width: 0; }
    .back {
      min-height: 44px;
      min-width: 44px;
      padding: 0 8px 0 0;
      color: #cbd5e1;
      font-weight: 500;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      flex: none;
    }
    .team-select {
      width: 100%;
      min-height: 44px;
      margin: 8px 0 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: 8px 12px;
      font-weight: 500;
    }
    h2 {
      margin: 12px 0 6px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .game-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      width: 100%;
      min-height: 64px;
      padding: 12px 14px;
      margin: 0 0 8px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 14px;
      text-align: left;
      color: inherit;
    }
    .game-top { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
    .game-btn strong { flex: 1; min-width: 0; font-size: 1rem; font-weight: 600; }
    .game-btn .meta { color: var(--muted); font-weight: 400; font-size: 0.82rem; }
    .game-btn.live { border-color: rgba(185, 28, 28, 0.55); }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex: none;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 6px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .board-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0b1220;
    }
    .board {
      display: grid;
      grid-template-columns: 6.1rem repeat(var(--n), minmax(1.35rem, 1fr)) 1.45rem 1.25rem 1.25rem;
      min-width: 100%;
    }
    .who, .inn, .run, .run-h, .he {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      background: transparent;
      color: inherit;
      padding: 0;
    }
    .who { justify-content: flex-start; padding: 0 4px; font-size: 0.68rem; line-height: 1.1; text-align: left; white-space: nowrap; }
    .head { border-top: 0; min-height: 24px; color: var(--muted); font-size: 0.72rem; }
    .run, .run-h, .he { border-left: 1px solid rgba(148, 163, 184, 0.28); background: #0b1220; }
    .he { font-size: 0.85rem; }
    .run { font-size: 1.05rem; }
    .inn { font-size: 0.95rem; }
    .inn.now { background: rgba(185, 28, 28, 0.2); color: var(--accent-ink); box-shadow: inset 0 -2px 0 #fecaca; }
    .batting { background: rgba(185, 28, 28, 0.1); }
    .inn.skip { color: #fda4af; }
    .who { background: #0b1220; }
    .batting.who, .batting.run, .batting.he { background: #2a1218; }

    .banner {
      margin-top: 8px;
      height: 64px;
      padding: 0 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: visible;
      white-space: nowrap;
    }
    .banner .half { flex: none; font-size: 1rem; font-weight: 600; }
    .banner .pill {
      height: 20px;
      padding: 0 6px;
      font-size: 0.62rem;
      flex: none;
    }
    .banner p { margin: 0; font-weight: 500; }
    .banner .role { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .banner.offense { background: rgba(185, 28, 28, 0.2); color: var(--accent-ink); }
    .banner.defense { background: rgba(185, 28, 28, 0.08); color: var(--ink); border: 1px solid rgba(185, 28, 28, 0.35); }
    .banner.final { background: var(--card); border: 1px solid var(--line); }
    .banner.final .role { text-transform: none; letter-spacing: 0; font-size: 0.95rem; font-weight: 600; }
    .half-num { font-size: 1.15rem; }
    .outs { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .out-marks { display: flex; gap: 4px; }
    .mark { width: 9px; height: 9px; border-radius: 99px; background: rgba(226, 232, 240, 0.28); display: block; }
    .mark.on, .banner.offense .mark.on, .banner.defense .mark.on { background: var(--accent); }
    .outs-label { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.88rem; }
    .tiebreaker {
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      border-radius: 12px;
      border: 1px solid rgba(185, 28, 28, 0.45);
      background: var(--soft);
      color: var(--accent-ink);
      font-weight: 500;
      text-align: left;
      padding: 0 12px;
    }

    .order { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
    .row { display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid rgba(148, 163, 184, 0.14); }
    .row:last-child { border-bottom: 0; }
    .row-hit {
      flex: 1; min-width: 0; min-height: 44px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 8px 0 10px; text-align: left; color: inherit;
    }
    .row .num { width: 1.4rem; flex: none; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
    .at-bat { box-shadow: inset 3px 0 0 var(--accent); background: rgba(185, 28, 28, 0.1); }
    .at-bat .num { color: var(--accent-ink); font-weight: 600; }
    .is-selected { background: rgba(148, 163, 184, 0.08); }
    .due { margin-left: auto; flex: none; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-ink); }
    .due.later { color: var(--muted); font-weight: 500; }
    .role-tag, .cr-tag { flex: none; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.03em; color: var(--accent-ink); }
    .sub-btn {
      min-height: 44px; min-width: 64px; margin-right: 6px;
      border-radius: 10px; border: 1px solid var(--line); background: #111827;
      font-weight: 500;
    }
    .field { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .pos-btn {
      min-height: 52px; min-width: 0; padding: 6px 8px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); color: inherit;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-align: left;
    }
    .pos-btn .pos { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
    .pos-btn .name { width: 100%; font-size: 0.78rem; }
    .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .toggle {
      min-height: 44px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); color: #cbd5e1; font-size: 0.85rem; font-weight: 500;
    }
    .toggle.on { border-color: rgba(185, 28, 28, 0.7); background: var(--soft); color: var(--accent-ink); }
    .track { display: flex; align-items: center; gap: 8px; min-height: 36px; border-top: 1px solid rgba(148, 163, 184, 0.14); }
    .track b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
    .spot { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    .innings-fold { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 0 12px 4px; }
    .innings-fold summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; }

    .dock {
      position: sticky; bottom: 0; z-index: 6; margin-top: 0;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      background: #020617;
      border-top: 1px solid var(--line);
      display: flex; flex-wrap: nowrap; align-items: stretch; gap: 6px;
    }
    .atbat-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .atbat-row .atbat { margin-top: 0; }
    .atbat-row .quiet { flex: none; min-width: 64px; min-height: 44px; }
    .atbat {
      width: 100%; min-height: 44px; margin-top: 8px; padding: 6px 10px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--card);
      text-align: left; font-weight: 500; line-height: 1.3;
    }
    .diamond-live { width: 56px; height: 56px; position: relative; flex: none; }
    .diamond-live .infield {
      position: absolute; left: 14px; top: 14px; width: 28px; height: 28px;
      border: 1.5px solid rgba(255,255,255,0.3); transform: rotate(45deg); pointer-events: none;
    }
    .diamond-live .base {
      position: absolute; width: 44px; height: 44px; padding: 0; margin: 0;
      border: 0; background: transparent; transform: none; box-shadow: none;
    }
    .diamond-live .base::after {
      content: ""; position: absolute; width: 16px; height: 16px; box-sizing: border-box;
      border: 1.5px solid rgba(255,255,255,0.55); background: transparent; transform: rotate(45deg);
    }
    .diamond-live .base.on,
    .diamond-live .base.on:hover { background: transparent; border-color: transparent; transform: none; }
    .diamond-live .base.on::after { background: var(--accent); border-color: var(--accent); }
    .diamond-live .b2 { top: 0; left: 6px; }
    .diamond-live .b2::after { left: 14px; top: 4px; }
    .diamond-live .b3 { top: 12px; left: 0; }
    .diamond-live .b3::after { left: 2px; top: 16px; }
    .diamond-live .b1 { top: 12px; left: 12px; }
    .diamond-live .b1::after { left: 24px; top: 16px; }
    .diamond-live .plate {
      position: absolute; left: 23px; bottom: 0; width: 10px; height: 8px; pointer-events: none;
      background: rgba(255,255,255,0.7); clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
    }
    .atbat-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 56px; }
    .atbat-copy { flex: 1; min-width: 0; }
    .atbat-line { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .atbat-line strong { font-size: 1rem; font-weight: 600; white-space: normal; overflow-wrap: anywhere; line-height: 1.2; }
    .count-stack { display: flex; flex-direction: column; align-items: stretch; gap: 6px; flex: none; }
    .count-chip {
      min-height: 44px; min-width: 72px; padding: 0 12px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); font-size: 1.15rem; font-weight: 600;
    }
    .count-actions { display: flex; gap: 6px; }
    .count-actions .quiet { min-height: 44px; min-width: 72px; padding: 0 12px; }
    .atbat-sub { margin: 0; color: var(--muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
    .dock .end-half, .dock .menu-link, .dock.solo .primary { grid-column: 1 / -1; }
    .dock.solo { grid-template-columns: 1fr; }
    .primary {
      min-height: 56px; border-radius: 16px; background: var(--accent); color: #fff;
      font-size: 1.15rem; font-weight: 600;
    }
    .quiet {
      min-height: 48px; border-radius: 12px; background: var(--card);
      border: 1px solid var(--line); color: var(--ink); font-weight: 500;
    }
    .quiet:disabled { opacity: 0.38; }
    .danger {
      min-height: 44px; color: #fecaca; font-weight: 600; background: transparent;
    }
    .menu-link {
      min-height: 44px; color: #fecaca; font-weight: 600; font-size: 0.9rem;
      text-align: right;
    }

    .sheet {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(2, 6, 23, 0.72);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 12px;
    }
    .sheet-card {
      width: min(420px, 100%);
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 24px;
      padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: min(88dvh, 720px);
      overflow: auto;
    }
    .sheet-card h2 { margin: 0 0 6px; font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; text-transform: none; color: #f8fafc; }
    #sub-effect { margin: 8px 0 12px; font-size: 1rem; font-weight: 500; line-height: 1.35; }
    .run-num { margin: 4px 0 8px; text-align: center; font-size: 3.2rem; line-height: 0.95; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pad button, .stepper button {
      min-height: 48px; min-width: 44px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--bg); color: #f8fafc;
      font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; margin: 12px 0; }
    .stepper p { margin: 0; text-align: center; font-weight: 600; }
    .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); margin: 10px 0; }
    .segment button { min-height: 44px; border-radius: 10px; color: #cbd5e1; font-weight: 500; }
    .segment button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
    .big {
      width: 100%; min-height: 48px; margin-top: 8px; border-radius: 14px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem;
    }
    .big.plain { background: #1e293b; color: var(--ink); }
    .big.danger { background: transparent; color: #fecaca; border: 1px solid rgba(252, 165, 165, 0.45); }
    .big:disabled { opacity: 0.4; }
    .pick {
      width: 100%; min-height: 48px; margin: 0 0 8px; padding: 8px 12px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
      text-align: left; font-weight: 500;
    }
    .lineup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
    .mini { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 28px; border-top: 1px solid rgba(148, 163, 184, 0.14); }
    .mini .pos { flex: none; min-width: 1.5rem; color: var(--muted); font-size: 0.75rem; font-weight: 600; }
    .mini .name { flex: 1; font-size: 0.8rem; }
    .empty, .subs, .final-note { margin: 8px 0; color: #cbd5e1; font-weight: 400; border: 0; background: transparent; padding: 0; }
    .form-error { margin: 8px 0 0; color: #fecaca; font-weight: 500; font-size: 0.9rem; }
    .sync { margin: 2px 0 0; font-size: 0.78rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
    .sync.saving, .sync.offline { color: var(--accent-ink); }
    .sync.local { color: var(--muted); }
    .sync-notice { margin: 6px 0 0; padding: 6px 8px; border-radius: 10px; background: var(--soft); color: var(--accent-ink); font-weight: 500; }
    .text-input {
      width: 100%; min-height: 44px; margin: 8px 0; border-radius: 12px;
      border: 1px solid var(--line); background: var(--bg); padding: 8px 12px; font-size: 16px;
    }
    .winner { font-weight: 600; }
    main { padding-bottom: 16px; }
    .more { min-width: 44px; min-height: 44px; flex: none; font-size: 1.2rem; color: var(--muted); }
    .menu-link { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .dock { display: flex; flex-wrap: nowrap; align-items: stretch; background: #020617; }
    .dock .primary { flex: 1.35; min-width: 0; }
    .dock .quiet, .dock .menu-link { flex: 1; min-width: 0; min-height: 56px; }
    .dock .end-half { flex-basis: auto; }
    .snack {
      position: relative; z-index: 5; margin: 8px 0 0;
      padding: 8px 10px; border-radius: 10px; background: #1e293b; color: var(--accent-ink); font-weight: 600;
    }
    .dp-chip, .cancel-chip { min-height: 40px; border-radius: 12px; font-weight: 600; }
    .dp-chip { width: 100%; background: var(--accent); color: #fff; }
    .cancel-chip { display: block; width: 100%; margin-top: 8px; padding: 0 12px; background: transparent; color: #fecaca; border: 1px solid rgba(252, 165, 165, 0.45); }
    .run-note { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--soft); color: var(--accent-ink); font-weight: 600; }
    .flex-actions { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    .flex-actions .quiet { width: 100%; }
    .count-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; margin: 8px 0; }
    .count-row .quiet { min-width: 0; padding: 0 10px; flex: 0 1 auto; }
    .count { margin: 0; font-size: 1.4rem; min-width: 2.2rem; }
    .diamond { width: 78px; height: 68px; position: relative; margin-left: auto; flex: none; }
    .diamond .base { position: absolute; width: 16px; height: 16px; padding: 0; border: 1px solid #cbd5e1; background: #0b1220; transform: rotate(45deg); }
    .diamond .base.on { background: var(--accent); border-color: var(--accent); }
    .diamond .b2 { top: 4px; left: 31px; }
    .diamond .b3 { top: 32px; left: 8px; }
    .diamond .b1 { top: 32px; left: 54px; }
    .undo-toast { margin: 0 0 6px; padding: 8px 10px; border-radius: 10px; background: #1e293b; color: var(--accent-ink); font-weight: 600; }
    .quiet.end-half { width: 100%; }

  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../shared/elks-data.js"></script>
  <script src="../shared/game-manager.js"></script>
  <script src="../shared/game-sync.js"></script>
  <script>
    var STORAGE_KEY = (window.GameManager && GameManager.STORAGE_KEY) || "mn-elks-game-manager-v1";
    var sync = null;
    var syncLive = "sse";
    var lineupCache = { teams: {} };
    var applyingLocal = false;
    var teamId = "";
    var teamName = "Us";
    var view = "list";
    var gameId = "";
    var sheet = "";
    var pickPos = "";
    var runDigits = "";
    var plannedInnings = 7;
    var subSpot = 0;
    var pendingSub = null;
    var effectText = "";
    var courtesyFor = "";
    var illegalReason = "";
    var selectedId = "";
    var plannedSide = "away";
    var errorText = "";
    var runnerOutPick = false;
    var customAfter = "5";
    var customLead = "10";
    var baseHoldTimer = 0;
    var baseHeld = false;
    var oppDraft = "";
    var dpDraft = "";
    var flexDraft = "";
    var endReason = "final";
    var endRuns = "";
    var forfeitWinner = "us";
    var editAt = null;
    var loadNote = "";
    var booting = true;
    var loadToken = 0;

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function currentTeam() {
      var hub = window.HUB_SOFTBALL || {};

      var name = hub.teamName || "Team";
      var club = hub.clubName || "";
      if (window.ElksData && ElksData.currentHubTeam) {
        var team = ElksData.currentHubTeam();
        raw = team.id || raw;
        name = team.name || name;
        club = team.clubName || club;
      }
      var id = raw;
      if (window.ElksData && ElksData.canonicalTeamId) id = ElksData.canonicalTeamId(raw) || raw;
      return { id: id || "team", rawId: raw, name: name, clubName: club };
    }

    function teamLabel(team) {
      return [team.clubName, team.name].filter(Boolean).join(" ") || "Us";
    }

    function pinRealTeam() {
      var team = currentTeam();
      if (team.id && team.id !== "all" && team.id !== "unassigned" && team.id !== "team") return team;
      var teams = teamChoices().filter(function (item) {
        return item && item.id && item.id !== "all" && item.id !== "unassigned";
      });
      if (!teams.length) return team;
      if (window.ElksData && ElksData.setCurrentHubTeam) ElksData.setCurrentHubTeam(teams[0].id);
      team = currentTeam();
      if (!team.id || team.id === "all" || team.id === "unassigned" || team.id === "team") {
        return {
          id: teams[0].id,
          rawId: teams[0].id,
          name: teams[0].name || "Team",
          clubName: teams[0].clubName || "",
        };
      }
      return team;
    }

    function teamChoices() {
      var hub = window.HUB_SOFTBALL || {};
      return Array.isArray(hub.teams) ? hub.teams : [];
    }

    function doc() {
      return sync ? sync.display() : GameManager.emptyDocument();
    }

    function cachePack() {
      if (!lineupCache.teams) lineupCache.teams = {};
      if (!lineupCache.teams[teamId]) {
        lineupCache.teams[teamId] = { teamName: teamName, games: [], players: [] };
      }
      lineupCache.teams[teamId].teamName = teamName || lineupCache.teams[teamId].teamName;
      return lineupCache.teams[teamId];
    }

    function saveCache() {
      if (sync) sync.setCache(lineupCache);
    }

    function bundle() {
      var cache = cachePack();
      var live = (doc().teams && doc().teams[teamId]) || { sessions: {} };
      return {
        teamName: cache.teamName,
        games: cache.games,
        players: cache.players,
        sessions: live.sessions || {},
      };
    }

    function syncChip() {
      if (!sync) return "";
      var kind = sync.status();
      if (kind === "saved" && !sync.notice()) return "";
      return '<p id="sync-status" class="sync ' + esc(kind) + '">' + esc(sync.statusLabel()) + "</p>";
    }

    function syncNotice() {
      if (!sync) return "";
      var note = sync.notice();
      if (!note) return "";
      return '<p id="sync-notice" class="sync-notice">' + esc(note) + "</p>";
    }

    function tap(op) {
      var session = sessionFor(gameId);
      var next = Object.assign({ teamId: teamId, teamName: teamName, gameId: gameId }, op);
      if (session && next.type !== "start" && next.type !== "set-active" && next.type !== "resume") {
        next.atHalf = {
          inningIndex: session.inningIndex,
          half: session.half,
          outs: GameManager.clampOuts(session.outs),
          liveRuns: Number(session.liveRuns) || 0,
          battingIndex: Number(session.battingIndex) || 0,
          actionId: Number(session.actionSeq) || 0,
          status: session.status || "",
          tally: (Number(session.usHits) || 0) + (Number(session.oppHits) || 0) + (Number(session.usErrors) || 0) + (Number(session.oppErrors) || 0),
        };
      }
      try {
        var preview = dryRun(next);
        if (preview && preview.dropNotice) {
          errorText = preview.dropNotice;
          render();
          return null;
        }
      } catch (e) {
        errorText = e && e.message ? e.message : "That did not work.";
        render();
        return null;
      }
      errorText = "";
      applyingLocal = true;
      try {
        return sync.run(next);
      } finally {
        applyingLocal = false;
      }
    }

    function dryRun(op) {
      return GameManager.applyGameOp(doc(), Object.assign({ teamId: teamId, teamName: teamName, gameId: gameId }, op));
    }

    function sessionFor(id) {
      var found = bundle().sessions[id];
      return found || null;
    }

    function findGame(id) {
      var games = bundle().games || [];
      for (var i = 0; i < games.length; i += 1) {
        if (games[i] && games[i].id === id) return games[i];
      }
      var session = sessionFor(id);
      return (session && session.lineupSnapshot) || null;
    }

    function gamesForList() {
      var pack = bundle();
      var games = (pack.games || []).slice();
      var ids = {};
      games.forEach(function (game) { if (game && game.id) ids[game.id] = true; });
      Object.keys(pack.sessions || {}).forEach(function (id) {
        var session = pack.sessions[id];
        if (session && session.status === "live" && !ids[id]) {
          games.push(session.lineupSnapshot || { id: id, name: session.gameName || "Game", battingOrder: [] });
        }
      });
      return games;
    }

    function readLegacyLineup(id) {
      try {
        var key = id ? "mn-elks-lineup-v1:" + id : "mn-elks-lineup-v1";
        var saved = localStorage.getItem(key);
        if (!saved && id === "team-16u-fransen") saved = localStorage.getItem("mn-elks-lineup-v1");
        return saved ? JSON.parse(saved) : null;
      } catch (e) {
        return null;
      }
    }

    function rosterFrom(state, games) {
      var rawPlayers = state && Array.isArray(state.players) ? state.players : [];
      var list = [];
      if (window.ElksData && ElksData.playersForTeam && ElksData.toLineupPlayer) {
        try {
          list = ElksData.playersForTeam(state, teamId).map(function (player) {
            return GameManager.slimPlayer(ElksData.toLineupPlayer(player));
          }).filter(Boolean);
        } catch (e) {
          list = [];
        }
      }
      if (!list.length) list = GameManager.playersOnTeam(rawPlayers, teamId);
      var have = {};
      list.forEach(function (player) { have[player.id] = true; });
      var needed = {};
      (games || []).forEach(function (game) {
        (game.battingOrder || []).forEach(function (id) { needed[String(id)] = true; });
        (game.unavailableIds || []).forEach(function (id) { needed[String(id)] = true; });
        (game.inningDefenses || []).forEach(function (row) {
          Object.keys(row || {}).forEach(function (pos) {
            if (row[pos]) needed[String(row[pos])] = true;
          });
        });
        Object.keys(game.defensivePositions || {}).forEach(function (pos) {
          if (game.defensivePositions[pos]) needed[String(game.defensivePositions[pos])] = true;
        });
      });
      rawPlayers.forEach(function (player) {
        var slim = GameManager.slimPlayer(player);
        if (!slim || have[slim.id] || !needed[slim.id]) return;
        list.push(slim);
        have[slim.id] = true;
      });
      return list;
    }

    function namedSession(session) {
      if (!session) return session;
      var byId = {};
      (session.players || []).forEach(function (player) { byId[player.id] = player; });
      (bundle().players || []).forEach(function (player) { byId[player.id] = player; });
      var players = Object.keys(byId).map(function (id) { return byId[id]; });
      return Object.assign({}, session, { players: players });
    }

    function ordinalSuffix(n) {
      var mod100 = n % 100;
      var mod10 = n % 10;
      if (mod100 >= 11 && mod100 <= 13) return "th";
      if (mod10 === 1) return "st";
      if (mod10 === 2) return "nd";
      if (mod10 === 3) return "rd";
      return "th";
    }

    function gameTitle(name) {
      var opp = GameManager.opponentLabel(name);
      return opp ? "vs " + opp : (name || "Game");
    }

    function ourLine(session) {
      var rows = GameManager.scoreboardRows(session);
      var us = rows[0].team === "us" ? rows[0] : rows[1];
      var opp = us === rows[0] ? rows[1] : rows[0];
      var mark = us.total > opp.total ? "W" : us.total < opp.total ? "L" : "T";
      return { mark: mark, text: mark + " " + us.total + "–" + opp.total };
    }

    function finalLine(session) {
      if (session && session.endedReason === "forfeit") return ourLine(session).text + " · Forfeit";
      var note = GameManager.endNote(session);
      var banner = GameManager.finalBanner(session);
      if (note && banner.indexOf(note) >= 0) note = "";
      return ourLine(session).text + " · " + banner + (note ? " · " + note : "");
    }

    function gameDate(name) {
      var match = String(name || "").match(/[-–—]\s*(.+)$/);
      return match ? match[1] : "";
    }

    function cell(value) {
      if (value === "X") return "X";
      return typeof value === "number" ? String(value) : "";
    }

    function scoreboardHtml(state) {
      var board = GameManager.scoreboard(state);
      var rows = GameManager.scoreboardRows(state);
      var n = Math.max(1, board.innings.length);
      var batting = state && state.status === "live" ? (state.half === "bottom" ? "home" : "away") : "";
      function cells(row, header) {
        return board.innings.map(function (inn, index) {
          var shown = header ? String(inn.inning) : cell(row.cells[index]);
          var cls = "inn num-face" + (header ? " head" : "") + (inn.current ? " now" : "") + (!header && shown === "X" ? " skip" : "");
          if (!header && row.side === batting) cls += " batting";
          if (header || shown === "" || (state && state.status === "played" && !GameManager.lineupKept(state))) return '<div class="' + cls + '">' + esc(shown) + "</div>";
          var half = row.side === "away" ? "top" : "bottom";
          return '<button type="button" class="' + cls + '" data-action="edit-cell" data-inning="' + index + '" data-half="' + half + '" aria-label="Edit ' + esc(half) + " " + inn.inning + '">' + esc(shown) + "</button>";
        }).join("");
      }
      function teamLine(row) {
        var bat = row.side === batting ? " batting" : "";
        return '<div class="who' + bat + '" data-side="' + esc(row.side) + '" title="' + esc(row.name || row.label) + '">' + esc(row.label) + "</div>"
          + cells(row, false)
          + '<div class="run num-face' + bat + '">' + row.total + "</div>"
          + '<div class="he hits num-face' + bat + '">' + (row.hits || 0) + "</div>"
          + '<div class="he errs num-face' + bat + '">' + (row.errors || 0) + "</div>";
      }
      var headNums = board.innings.map(function (inn) {
        return '<div class="inn num-face head' + (inn.current ? " now" : "") + '">' + inn.inning + "</div>";
      }).join("");
      return '<div class="board-scroll" id="scoreboard" aria-label="Line score, away team on top">'
        + '<div class="board" style="--n:' + n + '">'
        + '<div class="who head"></div>' + headNums
        + '<div class="run-h num-face head">R</div><div class="he head">H</div><div class="he head">E</div>'
        + teamLine(rows[0]) + teamLine(rows[1])
        + "</div></div>";
    }

    function bannerHtml(state) {
      var board = GameManager.scoreboard(state);
      if (state.status !== "live") {
        return '<div id="half-indicator" class="banner final"><p class="half">' + esc(finalLine(state)) + "</p></div>";
      }
      var arrow = state.half === "bottom" ? "▼" : "▲";
      var word = state.half === "bottom" ? "Bot" : "Top";
      var num = (state.inningIndex || 0) + 1;
      var role = board.role === "defense" ? "DEFENSE" : "OFFENSE";
      var extra = board.extra ? '<span class="pill">EXTRA</span>' : "";
      return '<div id="half-indicator" class="banner ' + board.role + '"><p class="half">' + arrow + " " + esc(word) + " " + num + ordinalSuffix(num) + "</p>" + extra + '<span class="pill">' + role + "</span>" + outsHtml(state) + diamondHtml(state) + "</div>";
    }

    function diamondHtml(session) {
      var bases = (session && session.bases) || [false, false, false];
      return '<div class="diamond-live" aria-label="Bases">'
        + '<i class="infield"></i>'
        + '<button type="button" class="base b2' + (bases[1] ? " on" : "") + '" data-action="base" data-base="1" aria-label="Second base"></button>'
        + '<button type="button" class="base b3' + (bases[2] ? " on" : "") + '" data-action="base" data-base="2" aria-label="Third base"></button>'
        + '<button type="button" class="base b1' + (bases[0] ? " on" : "") + '" data-action="base" data-base="0" aria-label="First base"></button>'
        + '<i class="plate"></i></div>';
    }

    function pitchingLabel(session) {
      var id = session && session.defense && session.defense.P;
      var player = ((session && session.players) || []).filter(function (item) { return item.id === id; })[0];
      if (!player) return "Pitching";
      var number = player.number != null && String(player.number).trim() !== "" ? "#" + String(player.number).trim() + " " : "";
      var first = String(player.name || "Pitcher").split(/[\s/]+/).filter(Boolean)[0] || "Pitcher";
      return "Pitching " + number + first;
    }

    function followPrompt(session) {
      if (!session || !session.prompt) return "";
      return "prompt";
    }

    function firstName(label) {
      var text = String(label || "").replace(/^#\d+\s*/, "");
      return text.split(/\s+/)[0] || text;
    }

    function atBatStrip(session) {
      var onDefense = GameManager.roleFor(session.side, session.half) === "defense";
      var rows = GameManager.liveBatters(session);
      if (onDefense) {
        var where = tiebreakerPlace(session);
        var extra = where ? " · Their runner on " + where : "";
        return '<div class="atbat-row" id="at-bat"><div class="atbat-copy"><p class="atbat-line"><strong>' + esc(pitchingLabel(session) + extra) + "</strong></p></div></div>";
      }
      var due = rows.length ? GameManager.effectiveBatterIndex(session) % rows.length : 0;
      var batter = rows[due];
      var deck = rows.length ? rows[(due + 1) % rows.length] : null;
      var count = (session.balls || 0) + "-" + (session.strikes || 0);
      return '<div class="atbat-row" id="at-bat"><div class="atbat-copy">'
        + '<p class="atbat-line"><span class="tag">AB</span><strong>' + esc(batter ? batterFace(batter.label) : "—") + "</strong></p>"
        + '<p class="atbat-sub">On deck ' + esc(deck ? batterFace(deck.label) : "—") + "</p>"
        + "</div>"
        + '<div class="count-stack">'
        + '<button type="button" class="count-chip num-face" id="count-chip" data-action="open-count">' + esc(count) + "</button>"
        + '<div class="count-actions">'
        + '<button type="button" class="quiet" data-action="ball">Ball</button>'
        + '<button type="button" class="quiet" data-action="strike">Strike</button>'
        + "</div></div></div>";
    }

    function outsHtml(session) {
      var outs = GameManager.clampOuts(session.outs);
      var dots = [0, 1, 2].map(function (index) {
        return '<i class="mark' + (index < outs ? " on" : "") + '"></i>';
      }).join("");
      var label = outs === 1 ? "1 out" : outs + " outs";
      return '<div id="outs" class="outs" aria-label="' + esc(label) + '"><span class="out-marks">' + dots + '</span><span class="outs-label">' + esc(label) + "</span></div>";
    }

    function suggestedEnd(session) {
      if (!session) return "final";
      if (session.prompt === "run-rule") return "run-rule";
      if (session.prompt === "walk-off") return "walk-off";
      var board = GameManager.scoreboard(session);
      var home = session.side === "home" ? board.usTotal : board.oppTotal;
      var away = session.side === "home" ? board.oppTotal : board.usTotal;
      var inning = (session.inningIndex || 0) + 1;
      var last = inning >= (session.scheduledInnings || 7) || GameManager.tiebreakerActive(session);
      if (session.half === "bottom" && home > away && last) return "walk-off";
      return "final";
    }

    function tiebreakerPlace(session) {
      if (!session) return "";
      var id = session.itbRunnerId;
      if (!id) return "";
      var runners = session.baseRunners || [];
      var spot = runners.indexOf(id);
      return spot === 0 ? "1st" : spot === 1 ? "2nd" : spot === 2 ? "3rd" : "";
    }

    function tiebreakerHtml(session) {
      if (GameManager.roleFor(session.side, session.half) !== "offense") return "";
      var place = tiebreakerPlace(session);
      if (!place) return "";
      var runner = GameManager.itbRunner(session);
      var text = "Tiebreaker · " + (runner && runner.label ? runner.label : "Tiebreaker runner") + " on " + place;
      return '<button type="button" id="tiebreaker" class="tiebreaker" data-action="change-runner" aria-pressed="true">' + esc(text) + "</button>";
    }

    function trackerRows(state, playedOnly) {
      var rows = GameManager.defensiveInningRows(namedSession(state));
      if (playedOnly) rows = rows.filter(function (row) { return row.outs > 0; });
      if (!rows.length) return '<p class="empty">No defensive innings yet.</p>';
      return rows.map(function (row) {
        return '<div class="track"><span>' + esc(row.label) + "</span>"
          + (row.position ? '<span class="spot">' + esc(row.position) + "</span>" : "")
          + "<b>" + esc(row.innings) + "</b></div>";
      }).join("");
    }

    function shortName(label) {
      var text = String(label || "");

      return (num ? num[0] + " " : "") + rest;
    }

    function trackerHtml(state, folded) {

    }

    function battingOrderHtml(session) {
      var rowsIn = GameManager.liveBatters(session);
      if (!rowsIn.length) return '<h2 id="batting-order">Batting order</h2><p class="empty">No batting order in this lineup.</p>';
      var tags = ["Due up", "On deck", "In the hole"];
      var dueAt = GameManager.dueSlots(rowsIn.length, GameManager.effectiveBatterIndex(session));
      var tagFor = {};
      dueAt.forEach(function (index, nth) { tagFor[index] = tags[nth]; });
      var canSub = session.battingMode && session.battingMode !== "roster";
      var courtesy = courtesyList(session);
      var rows = rowsIn.map(function (row, index) {

        var role = row.role ? '<span class="role-tag">' + esc(row.role) + "</span>" : "";
        var cr = courtesy.filter(function (item) { return item.forId === row.id || item.runnerId === row.id; })[0];
        var crTag = cr ? '<span class="cr-tag">CR ' + esc(playerName(session, cr.runnerId)) + "</span>" : "";
        var cls = "row" + (tagName === "Due up" ? " at-bat" : "");
        var more = canSub

          : (session.battingMode === "roster"

            : "");
        return '<div class="' + cls + '"><button type="button" class="row-hit" data-action="select-player" data-player="' + esc(row.id) + '" data-spot="' + index + '">'
          + '<span class="num">' + row.order + '</span><span class="name">' + esc(batterFace(row.label)) + "</span>" + role + crTag + tag
          + "</button>" + more + "</div>";
      }).join("");
      return '<h2 id="batting-order">Batting order</h2>' + cardNote(session)
        + swapButton(session) + '<div class="order">' + rows + "</div>";
    }

    function defenseEditorHtml(session) {
      var rows = GameManager.defenseRows(session.defense, session.players).filter(function (row) {

      var defense = rows.map(function (row) {

    function batterFace(label) {

      var parts = rest.split(/\s*\/\s*/);
      if (parts.length === 2) return (num ? num[0] + " " : "") + parts[1] + " · for " + parts[0];

    function cardNote() {
      return "";
    }

    function countBox(session) {

        + '<button type="button" class="base b3' + (bases[2] ? " on" : "") + '" data-action="base" data-base="2" aria-label="Third base"></button>'
        + '<button type="button" class="base b1' + (bases[0] ? " on" : "") + '" data-action="base" data-base="0" aria-label="First base"></button>'
        + "</div></div>";

    function playerName(session, id) {
      var player = (session.players || []).filter(function (item) { return item.id === id; })[0];

    function swapButton(session) {

    function courtesyList(session) {
      var raw = session && session.courtesy;
