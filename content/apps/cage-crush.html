<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cage Crush</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600;700&display=swap");
    body { font-family: Inter, system-ui, sans-serif; touch-action: manipulation; }
    .title-font { font-family: "Space Grotesk", Inter, sans-serif; letter-spacing: -0.03em; }
    #stage {
      width: 100%;
      height: min(68vh, 560px);
      display: block;
      background: #4f8fd1;
    }
    .swing-btn {
      user-select: none;
      -webkit-user-select: none;
    }
    .swing-btn:active { transform: scale(0.97); }
  </style>
</head>
<body class="min-h-dvh bg-slate-950 text-slate-100">
  <div class="mx-auto grid w-full max-w-5xl gap-4 px-4 py-6 sm:px-6">
    <header class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <a href="/" class="text-sm text-slate-400 hover:text-red-400 shrink-0">← Hub</a>
        <div class="flex size-12 items-center justify-center rounded-2xl bg-red-700 shrink-0">
          <i class="fa-solid fa-baseball-bat-ball text-white text-lg"></i>
        </div>
        <div class="min-w-0">
          <h1 class="title-font text-2xl font-semibold">Cage Crush</h1>
          <p id="player-line" class="text-sm text-slate-400">Softball arcade</p>
        </div>
      </div>
      <div class="text-right shrink-0">
        <p class="text-[11px] font-semibold tracking-[0.14em] text-slate-500 uppercase">This week</p>
        <p id="high-score" class="title-font text-2xl text-red-400">0</p>
        <p id="reset-line" class="text-[11px] text-slate-500">Resets Sunday 11:59 PM CT</p>
      </div>
    </header>

    <section class="grid gap-3 overflow-hidden rounded-3xl border border-slate-800 bg-slate-900 p-3 sm:p-5">
      <div class="flex flex-wrap items-center justify-between gap-2 px-1">
        <div class="flex flex-wrap gap-4 text-sm">
          <p>Score <span id="score" class="font-semibold text-white">0</span></p>
          <p>Outs <span id="outs" class="font-semibold text-white">0 / 5</span></p>
          <p>Streak <span id="streak" class="font-semibold text-amber-300">0</span></p>
        </div>
        <p id="pitch-call" class="text-sm font-semibold text-red-300">Tap Play</p>
      </div>
      <div class="-mx-3 sm:-mx-5">
        <canvas id="stage" width="1100" height="560"></canvas>
      </div>
      <div class="grid gap-2 sm:grid-cols-[1fr_auto_1fr] items-center">
        <p id="result-line" class="text-sm text-slate-400 sm:text-left text-center">Time the swing as the ball crosses the plate.</p>
        <button type="button" id="swing" class="swing-btn rounded-2xl bg-red-700 px-10 py-4 text-lg font-extrabold tracking-wide hover:bg-red-600">
          SWING
        </button>
        <div class="flex justify-center sm:justify-end">
          <button type="button" id="play" class="rounded-2xl bg-slate-800 px-5 py-3 text-sm font-semibold hover:bg-slate-700">
            Play
          </button>
        </div>
      </div>
    </section>

    <section class="grid gap-3 rounded-3xl border border-slate-800 bg-slate-900 p-5">
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="font-semibold">Weekly board</h2>
        <p id="board-sub" class="text-xs text-slate-500">Resets Sunday 11:59 PM CT</p>
      </div>
      <ol id="board-list" class="grid gap-2"></ol>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const PITCHES = [
      { id: "fb", name: "FASTBALL", speed: 1, rise: 0, cut: 0 },
      { id: "ch", name: "CHANGE", speed: 0.66, rise: 0.12, cut: 0 },
      { id: "rs", name: "RISE", speed: 0.9, rise: -0.42, cut: 0 },
      { id: "dr", name: "DROP", speed: 0.86, rise: 0.48, cut: 0 },
      { id: "sc", name: "SCREW", speed: 0.88, rise: 0.08, cut: -0.38 }
    ];
    const OUTS_LIMIT = 5;
    const hub = window.HUB_SOFTBALL || {};
    const scoreKey = "cage-crush:" + (hub.userId || "local");
    let board = { weekId: "", resetsAt: 0, entries: [] };
    let myId = hub.userId || "";

    let gameId = 0;
    const state = {
      running: false,
      phase: "idle",
      score: 0,
      outs: 0,
      streak: 0,
      high: 0,
      pitch: null,
      t: 0,
      last: 0,
      shake: 0,
      flash: 0,
      flight: null,
      playTimer: 0,
      sparks: [],
      call: "Tap Play",
      result: "Time the swing as the ball crosses the plate.",
      feedback: "",
      smashT: 0,
      smash: 0,
      smashLive: 0
    };

    function myWeeklyBest() {
      const mine = board.entries.find(function (row) { return row.userId === myId; });
      return mine ? mine.score : 0;
    }

    function resetLabel() {
      if (!board.resetsAt) return "Resets Sunday 11:59 PM CT";
      const when = new Date(board.resetsAt);
      const label = when.toLocaleString("en-US", {
        timeZone: "America/Chicago",
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
      return "Resets " + label + " CT";
    }

    function renderBoard() {
      const mount = document.getElementById("board-list");
      document.getElementById("board-sub").textContent = resetLabel();
      document.getElementById("reset-line").textContent = resetLabel();
      if (!board.entries.length) {
        mount.innerHTML = '<li class="rounded-2xl border border-slate-800 bg-slate-950 px-4 py-3 text-sm text-slate-500">No scores this week yet.</li>';
        return;
      }
      mount.innerHTML = board.entries.map(function (row, index) {
        const mine = row.userId === myId;
        return (
          '<li class="flex items-center justify-between gap-3 rounded-2xl border px-4 py-3 ' +
            (mine ? "border-red-700 bg-red-950/40" : "border-slate-800 bg-slate-950") + '">' +
            '<div class="min-w-0">' +
              '<p class="text-sm font-semibold">' +
                (index + 1) + ". " + escapeHtml(row.name) + (mine ? " · you" : "") +
              "</p>" +
            "</div>" +
            '<p class="title-font text-lg text-red-300">' + row.score + "</p>" +
          "</li>"
        );
      }).join("");
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyBoard(next, userId) {
      if (!next) return;
      board = next;
      if (userId) myId = userId;
      state.high = myWeeklyBest();
      try {
        localStorage.setItem(scoreKey, JSON.stringify({ high: state.high, weekId: board.weekId, at: Date.now() }));
      } catch (err) { /* ignore */ }
      hud();
      renderBoard();
    }

    async function loadBoard() {
      try {
        const raw = JSON.parse(localStorage.getItem(scoreKey) || "{}");
        if (raw.weekId && raw.high) state.high = Number(raw.high) || 0;
      } catch (err) { /* ignore */ }
      try {
        const response = await fetch("/api/softball/cage-crush");
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) return;
        applyBoard(data.board, data.userId);
      } catch (err) { /* keep local */ }
    }

    async function submitScore(score) {
      if (!score) return;
      try {
        const response = await fetch("/api/softball/cage-crush", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ score: score })
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) return;
        applyBoard(data.board, data.userId);
      } catch (err) { /* ignore */ }
    }

    function hud() {
      document.getElementById("score").textContent = String(state.score);
      document.getElementById("outs").textContent = state.outs + " / " + OUTS_LIMIT;
      document.getElementById("streak").textContent = String(state.streak);
      document.getElementById("high-score").textContent = String(state.high);
      document.getElementById("pitch-call").textContent = state.call;
      document.getElementById("result-line").textContent = state.result;
      document.getElementById("play").textContent = state.running ? "New game" : "Play";
      document.getElementById("swing").textContent = state.phase === "smash" ? "LOCK" : "SWING";
      const name = hub.userName || hub.teamName || "Softball arcade";
      document.getElementById("player-line").textContent = name;
    }

    function beep(freq, dur, type, gain) {
      try {
        const ac = beep.ac || (beep.ac = new AudioContext());
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = type || "square";
        osc.frequency.value = freq;
        g.gain.value = gain || 0.04;
        osc.connect(g);
        g.connect(ac.destination);
        osc.start();
        osc.stop(ac.currentTime + (dur || 0.08));
      } catch (err) { /* silent */ }
    }

    const PITCH_SPOTS = ["inside", "middle", "outside"];

    function pickPitch() {
      const base = PITCHES[Math.floor(Math.random() * PITCHES.length)];
      return Object.assign({}, base, {
        spot: PITCH_SPOTS[Math.floor(Math.random() * PITCH_SPOTS.length)]
      });
    }

    function pitchCall(name, spot) {
      return (spot ? String(spot).toUpperCase() + " " : "") + name;
    }

    function startGame() {
      gameId += 1;
      state.running = true;
      state.score = 0;
      state.outs = 0;
      state.streak = 0;
      state.shake = 0;
      state.sparks = [];
      state.feedback = "";
      clearTimeout(state.playTimer);
      state.result = "Here it comes.";
      nextPitch();
      hud();
    }

    function nextPitch() {
      if (state.outs >= OUTS_LIMIT) {
        endGame();
        return;
      }
      state.pitch = pickPitch();
      state.t = 0;
      state.smashT = 0;
      state.smash = 0;
      state.smashLive = 0;
      state.phase = "smash";
      state.flight = null;
      state.call = "SMASH";
      state.feedback = "";
      state.result = "Lock smash at the top.";
      hud();
      beep(220, 0.06, "triangle", 0.03);
    }

    function smashValue(cycleT) {
      const u = ((cycleT % 2) + 2) % 2;
      if (u <= 1) return u * u;
      const t = u - 1;
      return (1 - t) * (1 - t);
    }

    function smashCarry(base, smash) {
      const s = Math.max(0, Math.min(1, smash));
      return base * (0.5 + s);
    }

    function smashLaunch(base, smash) {
      const s = Math.max(0, Math.min(1, smash));
      return base * (0.75 + s * 0.7);
    }

    function lockSmash() {
      if (!state.running || state.phase !== "smash") return;
      state.smash = smashValue(state.smashT);
      state.smashLive = state.smash;
      state.phase = "pitch";
      state.t = 0;
      state.call = pitchCall(state.pitch.name, state.pitch.spot);
      state.result = "Smash " + Math.round(state.smash * 100) + "  ·  swing when it crosses.";
      hud();
      beep(280 + state.smash * 280, 0.07, "square", 0.04);
    }

    const SWEET_T = 0.82;
    const SWING_WINDOW = 0.3;
    const PLATE_FRONT = 0.76;
    const PLATE_MIDDLE = 0.88;
    const FLIGHT_SPEED = 0.36;
    const HR_SMASH = 0.78;
    const HR_MATCH = 0.55;
    const IDEAL_CONTACT = { inside: 0.7, middle: 0.82, outside: 0.91 };
    const SPOT_SHIFT = { inside: -32, middle: 0, outside: 32 };
    const FIELD_JERSEY = "#1d4ed8";
    const BAT_JERSEY = "#c81e1e";

    function qualityFromT(t) {
      return Math.max(0, 1 - Math.abs(t - SWEET_T) / SWING_WINDOW);
    }

    function plateZone(t) {
      if (t < PLATE_FRONT) return "out-front";
      if (t <= PLATE_MIDDLE) return "front-plate";
      if (t <= 0.98) return "mid-plate";
      return "late";
    }

    function contactMatch(t, spot) {
      const zone = plateZone(t);
      if (spot === "inside") {
        if (zone === "out-front") return 1;
        if (zone === "front-plate") return 0.68;
        return 0.22;
      }
      if (spot === "outside") {
        if (zone === "mid-plate") return 1;
        if (zone === "front-plate") return 0.68;
        if (zone === "out-front") return 0.22;
        return 0.4;
      }
      if (zone === "front-plate") return 1;
      if (zone === "out-front" || zone === "mid-plate") return 0.58;
      return 0.28;
    }

    function canHomer(smash, match) {
      return smash >= HR_SMASH && match >= HR_MATCH;
    }

    function sprayFromTiming(t, kind) {
      if (kind === "foul") return t < SWEET_T ? -1.22 : 1.22;
      if (kind === "miss") return 0;
      if (t < PLATE_FRONT) return Math.max(-1.05, -0.42 - (PLATE_FRONT - t) * 4);
      if (t <= PLATE_MIDDLE) return (t - SWEET_T) * 0.45;
      return Math.min(1.05, 0.4 + (t - PLATE_MIDDLE) * 4);
    }

    function sprayFromSpot(t, spot, kind) {
      if (kind === "foul") return t < (IDEAL_CONTACT[spot] || SWEET_T) ? -1.22 : 1.22;
      if (kind === "miss") return 0;
      if (spot === "outside" && t < PLATE_FRONT) {
        return Math.max(-1.05, -0.55 - (PLATE_FRONT - t) * 3);
      }
      if (spot === "inside" && t > PLATE_MIDDLE) {
        return Math.min(0.85, 0.18 + (t - PLATE_MIDDLE) * 2);
      }
      const match = contactMatch(t, spot);
      const ideal = spot === "inside" ? -0.78 : spot === "outside" ? 0.78 : 0;
      const timing = sprayFromTiming(t, kind);
      return Math.max(-1.12, Math.min(1.12, ideal * match + timing * (1 - match)));
    }

    function flightMaxDepth(dist) {
      return Math.max(0.28, Math.min(1.18, dist / 260));
    }

    function flightLift(kind, t, spot) {
      const ideal = spot && IDEAL_CONTACT[spot] ? IDEAL_CONTACT[spot] : SWEET_T;
      const onTime = Math.abs(t - ideal) <= 0.045;
      if (kind === "homer") return onTime ? 128 : 108;
      if (kind === "triple") return onTime ? 96 : 76;
      if (kind === "double") return onTime ? 86 : 68;
      if (kind === "single") return onTime ? 74 : 56;
      return 32;
    }

    function pitcherCanCatch(ball, flight) {
      if (ball.lift > 14) return false;
      if (flight.kind === "homer" || flight.kind === "triple" || flight.kind === "double") return false;
      if (Math.abs(flight.side) > 0.2) return false;
      return true;
    }

    function swingWhy(hit, pitch, t) {
      const name = pitch && pitch.name ? pitch.name.toLowerCase() : "pitch";
      const spot = pitch && pitch.spot;
      if (hit.label === "TAKE") return "Took the pitch";
      const delta = t - SWEET_T;
      const abs = Math.abs(delta);
      const side = delta < 0 ? "early" : "late";
      const zone = plateZone(t);
      if (hit.kind === "miss") {
        return (abs > 0.16 ? "Way " + side : side.charAt(0).toUpperCase() + side.slice(1)) + " on the " + name;
      }
      if (hit.label === "CAUGHT") return "Caught in the air by " + (hit.fielder || "a fielder");
      if (spot === "outside" && zone === "out-front") return "Rolled over the outside pitch";
      if (spot === "inside" && (zone === "mid-plate" || zone === "late")) return "Jammed on the inside pitch";
      if (hit.kind === "foul" || hit.kind === "out") {
        return "Weak contact · " + (abs <= 0.07 ? "just off" : "a little " + side);
      }
      if (spot === "inside" && zone === "out-front") return "Inside · out front · left";
      if (spot === "middle" && zone === "front-plate") return "Middle · front of the plate";
      if (spot === "outside" && zone === "mid-plate") return "Outside · mid-plate · right";
      if (t < PLATE_FRONT) return "Out in front · left field";
      if (t <= PLATE_MIDDLE) return "Front of the plate · up the middle";
      return "Middle of the plate · right field";
    }

    function evaluateSwing(t, pitch, smash, streak) {
      const spot = (pitch && pitch.spot) || "middle";
      const nearBall = Math.max(0, 1 - Math.abs(t - SWEET_T) / 0.34);
      const match = contactMatch(t, spot);
      if (nearBall < 0.12) {
        const miss = { kind: "miss", label: "WHIFF", pts: 0, out: true, dist: 0, side: 0, match: match };
        miss.why = swingWhy(miss, pitch, t);
        return miss;
      }
      let juice = (0.22 + 0.78 * match) * (0.4 + 0.6 * smash);
      if (pitch && (pitch.id === "fb" || pitch.id === "rs")) juice += 0.03;
      if (match < 0.45) juice = Math.min(juice, 0.52);
      let kind;
      let label;
      let pts;
      let out;
      let baseDist;
      if (juice < 0.28) {
        kind = "foul"; label = "FOUL"; pts = 0; out = false; baseDist = 40 + juice * 40;
      } else if (juice < 0.4) {
        kind = "out"; label = "WEAK OUT"; pts = 0; out = true; baseDist = 70 + juice * 50;
      } else if (canHomer(smash, match) && juice >= 0.7) {
        kind = "homer"; label = "GONE"; pts = 12 + Math.round(20 + juice * 30) + streak * 3; out = false; baseDist = 280 + juice * 40;
      } else if (juice < 0.55) {
        kind = "single"; label = "SINGLE"; pts = 2 + streak; out = false; baseDist = 120 + juice * 40;
      } else if (juice < 0.68) {
        kind = "double"; label = "DOUBLE"; pts = 4 + streak * 2; out = false; baseDist = 180 + juice * 40;
      } else if (juice < 0.82) {
        kind = "triple"; label = "GAP TRIPLE"; pts = 7 + streak * 2; out = false; baseDist = 230 + juice * 30;
      } else {
        kind = "homer"; label = "GONE"; pts = 12 + Math.round(20 + juice * 30) + streak * 3; out = false; baseDist = 280 + juice * 40;
      }
      const hit = {
        kind: kind,
        label: label,
        pts: pts,
        out: out,
        dist: smashCarry(baseDist, smash * (0.45 + 0.55 * match)),
        side: sprayFromSpot(t, spot, kind),
        match: match
      };
      hit.why = swingWhy(hit, pitch, t);
      return hit;
    }

    function swing() {
      if (state.phase === "smash") {
        lockSmash();
        return;
      }
      if (!state.running || state.phase !== "pitch") return;
      const hit = evaluateSwing(state.t, state.pitch, state.smash, state.streak);
      applyResult(hit, state.t);
    }

    function applyResult(hit, t) {
      state.phase = "result";
      state.flash = hit.kind === "homer" ? 18 : 8;
      state.shake = hit.kind === "homer" ? 14 : hit.kind === "miss" ? 4 : 7;
      state.score += hit.pts;
      if (hit.out) {
        state.outs += 1;
        state.streak = 0;
        beep(90, 0.12, "sawtooth", 0.05);
      } else if (hit.kind === "foul") {
        beep(160, 0.05, "square", 0.03);
      } else {
        state.streak += 1;
        beep(hit.kind === "homer" ? 520 : 340, 0.1, "square", 0.05);
        if (hit.kind === "homer") beep(720, 0.16, "triangle", 0.04);
      }
      if (state.score > state.high) state.high = state.score;
      const at = t == null ? state.t : t;
      const why = hit.why || swingWhy(hit, state.pitch, at);
      state.feedback = why;
      state.result = hit.label + (hit.pts ? "  +" + hit.pts : "") + "  ·  " + why;
      state.call = hit.label;
      const carry = hit.dist || 0;
      const maxDepth = flightMaxDepth(carry);
      const spot = state.pitch && state.pitch.spot;
      state.flight = {
        kind: hit.kind,
        dist: carry,
        pts: hit.pts,
        wasOut: !!hit.out,
        depth: 0,
        maxDepth: maxDepth,
        caught: false,
        catchAt: null,
        liftMax: smashLaunch(flightLift(hit.kind, at, spot), state.smash),
        side: hit.side != null ? hit.side : sprayFromSpot(at, spot || "middle", hit.kind)
      };
      burst(hit.kind);
      hud();
      scheduleNext(Math.round(maxDepth / FLIGHT_SPEED * 1000) + 500);
    }

    function scheduleNext(ms) {
      clearTimeout(state.playTimer);
      const id = gameId;
      state.playTimer = setTimeout(function () {
        if (id !== gameId || !state.running) return;
        if (state.outs >= OUTS_LIMIT) endGame();
        else nextPitch();
      }, ms);
    }

    function endGame() {
      state.running = false;
      state.phase = "over";
      state.call = "FINAL";
      const best = myWeeklyBest();
      const weeklyHigh = state.score > best;
      if (weeklyHigh) state.high = state.score;
      state.result = "Final  " + state.score + (weeklyHigh ? "  ·  new weekly high" : "");
      hud();
      beep(180, 0.2, "triangle", 0.05);
      submitScore(state.score);
    }

    function park(w, h) {
      const fenceTop = h * 0.188;
      const fenceH = Math.max(54, Math.round(h * 0.1));
      return {
        homeX: w * 0.5,
        homeY: h * 0.915,
        fenceTop: fenceTop,
        fenceY: fenceTop,
        fenceH: fenceH,
        fenceBottom: fenceTop + fenceH,
        leftX: 3,
        rightX: w - 3,
        moundT: 0.32
      };
    }

    function along(w, h, t, side) {
      const p = park(w, h);
      const s = Math.max(-1.4, Math.min(1.4, side || 0));
      return {
        x: p.homeX + ((p.rightX - p.homeX) * s) * t,
        y: p.homeY + (p.fenceBottom - p.homeY) * t
      };
    }

    const FIELDERS = [
      { id: "1b", name: "1B", t: 0.50, side: 0.90, num: "3", skin: "#e0b089" },
      { id: "2b", name: "2B", t: 0.60, side: 0.30, num: "4", skin: "#c68642" },
      { id: "ss", name: "SS", t: 0.58, side: -0.30, num: "6", skin: "#d4a574" },
      { id: "3b", name: "3B", t: 0.50, side: -0.90, num: "5", skin: "#8d5524" },
      { id: "lf", name: "LF", t: 0.86, side: -0.68, num: "7", skin: "#f1c27d" },
      { id: "cf", name: "CF", t: 0.88, side: 0, num: "9", skin: "#c68642" },
      { id: "rf", name: "RF", t: 0.86, side: 0.68, num: "2", skin: "#d9a57a" },
      { id: "p", name: "P", t: 0.32, side: 0, num: "1", skin: "#d9a57a" }
    ];

    function fielderScale(t) {
      return 0.34 + (1 - t) * 0.72;
    }

    function fielderSpot(w, h, spec) {
      const p = along(w, h, spec.t, spec.side);
      return { x: p.x, y: p.y, scale: fielderScale(spec.t), spec: spec };
    }

    function flightBall(w, h) {
      if (!state.flight || state.flight.kind === "miss") return null;
      if (state.flight.caught && state.flight.catchAt) return state.flight.catchAt;
      const t = Math.min(state.flight.maxDepth || 1, state.flight.depth || 0);
      const p = along(w, h, Math.min(1.05, t), state.flight.side);
      const frac = t / Math.max(0.2, state.flight.maxDepth || 1);
      const lift = Math.sin(Math.min(1, frac) * Math.PI) * (state.flight.liftMax || 28);
      const r = Math.max(3.5, 9 - t * 4);
      return { x: p.x, y: p.y - lift, lift: lift, r: r, t: t };
    }

    function airBallHitsFielder(ball, fielder) {
      if (ball.lift < 6) return false;
      const cx = fielder.x;
      const cy = fielder.y - 16 * fielder.scale;
      const reach = 18 * fielder.scale + ball.r;
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      return dx * dx + dy * dy <= reach * reach;
    }

    function checkCatch(w, h) {
      if (!state.flight || state.flight.caught) return;
      if (state.flight.kind === "miss") return;
      const ball = flightBall(w, h);
      if (!ball) return;
      if (state.flight.kind === "homer") return;
      for (let i = 0; i < FIELDERS.length; i += 1) {
        if (FIELDERS[i].id === "p" && !pitcherCanCatch(ball, state.flight)) continue;
        const spot = fielderSpot(w, h, FIELDERS[i]);
        if (!airBallHitsFielder(ball, spot)) continue;
        catchFly(FIELDERS[i], ball);
        return;
      }
    }

    function catchFly(fielder, ball) {
      if (!state.flight || state.flight.caught) return;
      state.flight.caught = true;
      state.flight.catchAt = { x: ball.x, y: ball.y, lift: ball.lift, r: ball.r, t: ball.t };
      if (state.flight.pts) state.score = Math.max(0, state.score - state.flight.pts);
      if (!state.flight.wasOut) state.outs += 1;
      state.streak = 0;
      state.call = "CAUGHT";
      state.feedback = "Caught in the air by " + fielder.name;
      state.result = "CAUGHT  ·  " + fielder.name + " in the air";
      state.flash = 8;
      beep(110, 0.14, "sawtooth", 0.05);
      hud();
      scheduleNext(1200);
    }

    function fairPath(ctx, w, h, tEnd) {
      const p = park(w, h);
      const end = tEnd == null ? 1 : tEnd;
      const left = along(w, h, end, -1);
      const right = along(w, h, end, 1);
      ctx.beginPath();
      ctx.moveTo(p.homeX, p.homeY);
      ctx.lineTo(left.x, left.y);
      if (end >= 0.99) {
        for (let i = 0; i <= 16; i += 1) {
          const pt = along(w, h, 1, -1 + (i / 16) * 2);
          ctx.lineTo(pt.x, pt.y);
        }
      }
      ctx.lineTo(right.x, right.y);
      ctx.closePath();
    }

    function burst(kind) {
      const n = kind === "homer" ? 28 : kind === "miss" ? 6 : 14;
      for (let i = 0; i < n; i += 1) {
        state.sparks.push({
          x: 0.5 + (Math.random() - 0.5) * 0.04,
          y: 0.8,
          vx: (Math.random() - 0.5) * 0.01,
          vy: (Math.random() - 0.75) * 0.012,
          life: 18 + Math.random() * 12,
          color: kind === "homer" ? "#fbbf24" : kind === "miss" ? "#94a3b8" : "#fff"
        });
      }
    }

    function ballPos(w, h, t, pitch) {
      const depth = park(w, h).moundT * (1 - t);
      const p = along(w, h, depth, (pitch.cut || 0) * t);
      const shift = (SPOT_SHIFT[pitch.spot] || 0) * t;
      return {
        x: p.x + shift,
        y: p.y + (pitch.rise || 0) * t * h * 0.12,
        r: 3.2 + t * 13
      };
    }

    function drawSky(w, h) {
      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.34);
      sky.addColorStop(0, "#7ec8f5");
      sky.addColorStop(1, "#4f8fd1");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#f8fafc";
      ctx.beginPath();
      ctx.ellipse(w * 0.16, h * 0.09, 42, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(w * 0.21, h * 0.075, 28, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(w * 0.78, h * 0.08, 36, 13, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCrowd(w, h) {
      const p = park(w, h);
      const top = Math.max(h * 0.1, p.fenceTop - h * 0.08);
      const bot = p.fenceTop;
      ctx.fillStyle = "#7f1d1d";
      ctx.fillRect(0, top, w, Math.max(8, bot - top));
      ctx.fillStyle = "#9f1239";
      ctx.fillRect(0, top, w, 8);
      for (let i = 0; i < 70; i += 1) {
        ctx.fillStyle = ["#fde68a", "#93c5fd", "#fca5a5", "#bbf7d0", "#e2e8f0"][i % 5];
        ctx.fillRect((i * 37) % (w - 8) + 3, top + 12 + (i * 13) % Math.max(8, bot - top - 18), 4, 5);
      }
    }

    function drawFence(w, h) {
      const p = park(w, h);
      const y = p.fenceTop;
      const fh = p.fenceH;
      const red = ctx.createLinearGradient(0, y, 0, y + fh);
      red.addColorStop(0, "#e11d2e");
      red.addColorStop(0.5, "#be123c");
      red.addColorStop(1, "#9f1239");
      ctx.fillStyle = red;
      ctx.fillRect(0, y, w, fh);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, y, w, 6);
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.fillRect(0, y + fh * 0.28, w, fh * 0.44);
      ctx.fillStyle = "#9f1239";
      ctx.fillRect(0, y + fh - 7, w, 7);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 " + Math.round(fh * 0.42) + "px Space Grotesk, Inter, sans-serif";
      ctx.lineJoin = "round";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#fff";
      ctx.strokeText("MN ELKS", w * 0.5, y + fh * 0.52);
      ctx.fillStyle = "#b91c1c";
      ctx.fillText("MN ELKS", w * 0.5, y + fh * 0.52);
      ctx.font = "700 11px Space Grotesk, Inter, sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText("200", w * 0.16, y + fh * 0.52);
      ctx.fillText("200", w * 0.84, y + fh * 0.52);

      function pole(x) {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(x - 3, y - 56, 6, fh + 62);
        ctx.fillStyle = "#e11d2e";
        ctx.fillRect(x - 3, y - 56, 6, 16);
      }
      pole(p.leftX);
      pole(p.rightX);
      ctx.textBaseline = "alphabetic";
    }

    function drawField(w, h) {
      const p = park(w, h);
      drawSky(w, h);
      drawCrowd(w, h);

      ctx.fillStyle = "#4ade80";
      ctx.fillRect(0, p.fenceBottom, w, h - p.fenceBottom);

      ctx.fillStyle = "#22c55e";
      fairPath(ctx, w, h, 1);
      ctx.fill();

      ctx.fillStyle = "#d6b07a";
      ctx.fillRect(0, p.fenceBottom, w, 22);

      const b3 = along(w, h, 0.5, -1);
      const b1 = along(w, h, 0.5, 1);
      const b2 = along(w, h, 0.62, 0);
      ctx.fillStyle = "#d2b48c";
      ctx.beginPath();
      ctx.moveTo(p.homeX, p.homeY);
      ctx.lineTo(b3.x, b3.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.lineTo(b1.x, b1.y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#c4a574";
      ctx.beginPath();
      ctx.ellipse(p.homeX, p.homeY - 6, 46, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      const mound = along(w, h, p.moundT, 0);
      ctx.fillStyle = "#c4a574";
      ctx.beginPath();
      ctx.ellipse(mound.x, mound.y + 8, 30, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(mound.x - 11, mound.y + 5, 22, 3);
      ctx.fillStyle = "#fff";
      [[b3.x + 10, b3.y + 8], [b1.x - 10, b1.y + 8], [b2.x, b2.y + 10]].forEach(function (pt) {
        ctx.save();
        ctx.translate(pt[0], pt[1]);
        ctx.rotate(-Math.PI / 4);
        ctx.fillRect(-6, -6, 12, 12);
        ctx.restore();
      });

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.homeX, p.homeY);
      ctx.lineTo(p.leftX, p.fenceBottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.homeX, p.homeY);
      ctx.lineTo(p.rightX, p.fenceBottom);
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = "800 13px Space Grotesk, Inter, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("3B", b3.x - 28, b3.y - 6);
      ctx.textAlign = "right";
      ctx.fillText("1B", b1.x + 28, b1.y - 6);

      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2;
      ctx.strokeRect(p.homeX - 52, p.homeY - 28, 22, 34);
      ctx.strokeRect(p.homeX + 30, p.homeY - 28, 22, 34);

      ctx.fillStyle = "#f8fafc";
      ctx.beginPath();
      ctx.moveTo(p.homeX, p.homeY + 10);
      ctx.lineTo(p.homeX - 16, p.homeY);
      ctx.lineTo(p.homeX - 9, p.homeY - 14);
      ctx.lineTo(p.homeX + 9, p.homeY - 14);
      ctx.lineTo(p.homeX + 16, p.homeY);
      ctx.closePath();
      ctx.fill();

      drawFence(w, h);
    }

    function oval(x, y, rx, ry, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function stick(x1, y1, x2, y2, width, color) {
      ctx.strokeStyle = color;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function paintSoftball(x, y, r) {
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
      g.addColorStop(0, "#ffe566");
      g.addColorStop(0.55, "#facc15");
      g.addColorStop(1, "#ca8a04");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#b91c1c";
      ctx.lineWidth = Math.max(1, r * 0.11);
      ctx.beginPath();
      ctx.arc(x - r * 0.08, y, r * 0.62, 0.25, 2.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x + r * 0.08, y, r * 0.62, 3.4, 5.55);
      ctx.stroke();
    }

    function drawPerson(x, y, scale, opt) {
      const s = scale;
      const skin = opt.skin || "#d4a574";
      const jersey = opt.jersey || FIELD_JERSEY;
      const pants = "#eef2f7";
      const crouch = opt.crouch || 0;
      const wind = opt.wind || 0;
      const hipY = -6 * s + crouch * 10 * s;
      const shY = -26 * s + crouch * 11 * s;
      const headY = -40 * s + crouch * 9 * s;
      ctx.save();
      ctx.translate(x, y);
      oval(0, 6 * s, 13 * s, 4 * s, "rgba(0,0,0,0.26)");
      const leftFoot = -7 * s - wind * 2 * s;
      const rightFoot = 7 * s + wind * 4 * s;
      stick(-3 * s, hipY, leftFoot, 4 * s, 5.2 * s, pants);
      stick(3 * s, hipY, rightFoot, 4 * s, 5.2 * s, pants);
      stick(leftFoot, 4 * s, leftFoot - 1 * s, 8 * s, 3 * s, "#f8fafc");
      stick(rightFoot, 4 * s, rightFoot + 1 * s, 8 * s, 3 * s, "#f8fafc");
      ctx.strokeStyle = jersey;
      ctx.lineWidth = Math.max(1, 1.1 * s);
      ctx.beginPath();
      ctx.moveTo(leftFoot - 3 * s, 6.5 * s);
      ctx.lineTo(leftFoot + 2 * s, 6.5 * s);
      ctx.moveTo(rightFoot - 2 * s, 6.5 * s);
      ctx.lineTo(rightFoot + 3 * s, 6.5 * s);
      ctx.stroke();
      oval(leftFoot - 1 * s, 10 * s, 4.2 * s, 2 * s, "#111827");
      oval(rightFoot + 1 * s, 10 * s, 4.2 * s, 2 * s, "#111827");
      oval(0, hipY, 8 * s, 5 * s, pants);
      ctx.fillStyle = jersey;
      ctx.beginPath();
      ctx.moveTo(-10 * s, shY + 3 * s);
      ctx.lineTo(10 * s, shY + 3 * s);
      ctx.lineTo(7.5 * s, hipY + 1 * s);
      ctx.lineTo(-7.5 * s, hipY + 1 * s);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#111827";
      ctx.fillRect(-7.5 * s, hipY - 1.5 * s, 15 * s, 2.2 * s);
      if (opt.number) {
        ctx.fillStyle = "#fff";
        ctx.font = "800 " + Math.max(7, 8.5 * s) + "px Space Grotesk, Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(String(opt.number), 0, shY + 15 * s);
      }
      oval(0, shY + 2 * s, 3 * s, 3.4 * s, skin);
      if (!opt.behind) {
        stick(9 * s, shY + 6 * s, 15 * s, shY + 16 * s, 3.4 * s, skin);
        oval(16 * s, shY + 18 * s, 4.6 * s, 3.6 * s, "#8b5a2b");
        ctx.save();
        ctx.translate(-9 * s, shY + 6 * s);
        ctx.rotate(opt.pitch ? -0.9 + wind * 1.7 : -0.25);
        stick(0, 0, -11 * s, 2 * s, 3.2 * s, skin);
        oval(-12 * s, 2 * s, 2.1 * s, 2.1 * s, skin);
        ctx.restore();
      } else {
        stick(-12 * s, shY + 6 * s, -18 * s, shY + 16 * s, 4 * s, jersey);
        oval(-19 * s, shY + 17 * s, 3.2 * s, 2.8 * s, skin);
      }
      if (opt.behind) {
        oval(0, headY + 4 * s, 5.5 * s, 4 * s, skin);
        const helm = ctx.createLinearGradient(-12 * s, headY - 10 * s, 12 * s, headY + 8 * s);
        helm.addColorStop(0, "#7f1d1d");
        helm.addColorStop(0.5, "#dc2626");
        helm.addColorStop(1, "#7f1d1d");
        oval(0, headY - 2 * s, 10 * s, 9 * s, helm);
        ctx.fillStyle = "#111827";
        ctx.fillRect(-11 * s, headY + 2 * s, 22 * s, 3.5 * s);
        oval(-9 * s, headY + 3 * s, 3.2 * s, 3.8 * s, "#7f1d1d");
        oval(9 * s, headY + 3 * s, 3.2 * s, 3.8 * s, "#7f1d1d");
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.beginPath();
        ctx.ellipse(-3 * s, headY - 5 * s, 3.2 * s, 1.6 * s, -0.4, 0, Math.PI * 2);
        ctx.fill();
      } else if (opt.mask) {
        oval(0, headY, 8 * s, 8.4 * s, "#111827");
        ctx.strokeStyle = "#d1d5db";
        ctx.lineWidth = Math.max(1.2, 1.6 * s);
        ctx.beginPath();
        ctx.arc(0, headY, 6.5 * s, 0.2, Math.PI - 0.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-4 * s, headY - 1 * s);
        ctx.lineTo(-4 * s, headY + 5 * s);
        ctx.moveTo(0, headY - 1 * s);
        ctx.lineTo(0, headY + 5 * s);
        ctx.moveTo(4 * s, headY - 1 * s);
        ctx.lineTo(4 * s, headY + 5 * s);
        ctx.stroke();
        oval(0, headY + 4 * s, 3.4 * s, 2.4 * s, skin);
      } else {
        oval(-6.4 * s, headY + 1 * s, 1.8 * s, 2.4 * s, skin);
        oval(6.4 * s, headY + 1 * s, 1.8 * s, 2.4 * s, skin);
        oval(0, headY, 7.2 * s, 8 * s, skin);
        ctx.fillStyle = opt.jersey === BAT_JERSEY ? "#111827" : "#1e3a8a";
        ctx.beginPath();
        ctx.ellipse(0, headY - 4 * s, 7.4 * s, 4.4 * s, 0, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-7.4 * s, headY - 4.2 * s, 14.8 * s, 2.6 * s);
        ctx.fillStyle = opt.jersey === BAT_JERSEY ? "#1f2937" : "#172554";
        ctx.beginPath();
        ctx.moveTo(-8 * s, headY - 1.6 * s);
        ctx.lineTo(8 * s, headY - 1.6 * s);
        ctx.lineTo(5 * s, headY + 0.4 * s);
        ctx.lineTo(-5 * s, headY + 0.4 * s);
        ctx.closePath();
        ctx.fill();
        if (s > 0.42) {
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.ellipse(-2.3 * s, headY + 0.6 * s, 1.5 * s, 1.2 * s, 0, 0, Math.PI * 2);
          ctx.ellipse(2.3 * s, headY + 0.6 * s, 1.5 * s, 1.2 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#1c1917";
          ctx.beginPath();
          ctx.arc(-2.2 * s, headY + 0.7 * s, 0.7 * s, 0, Math.PI * 2);
          ctx.arc(2.2 * s, headY + 0.7 * s, 0.7 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(80,40,20,0.55)";
          ctx.lineWidth = Math.max(0.8, 0.9 * s);
          ctx.beginPath();
          ctx.moveTo(0, headY + 1.6 * s);
          ctx.lineTo(0, headY + 3.6 * s);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, headY + 4.6 * s, 1.6 * s, 0.15, Math.PI - 0.15);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawDefense(w, h) {
      FIELDERS.filter(function (spec) { return spec.id !== "p"; })
        .map(function (spec) { return fielderSpot(w, h, spec); })
        .sort(function (a, b) { return a.y - b.y; })
        .forEach(function (spot) {
          drawPerson(spot.x, spot.y, spot.scale, {
            skin: spot.spec.skin,
            number: spot.spec.num,
            jersey: FIELD_JERSEY,
            glove: true
          });
        });
    }

    function drawPitcher(w, h, t) {
      const mound = along(w, h, park(w, h).moundT, 0);
      drawPerson(mound.x, mound.y + 6, fielderScale(park(w, h).moundT), {
        skin: "#d9a57a",
        number: "1",
        jersey: FIELD_JERSEY,
        pitch: true,
        wind: state.phase === "pitch" ? t : 0
      });
    }

    function drawBatter(w, h, swinging) {
      const p = park(w, h);
      const x = p.homeX - 38;
      const y = p.homeY + 10;
      drawPerson(x, y, 1.28, { skin: "#d9a57a", number: "8", jersey: BAT_JERSEY, behind: true });
      ctx.save();
      ctx.translate(x + 14, y - 28);
      ctx.rotate(swinging ? 1.42 : -1.18);
      stick(2, 8, 6, 12, 5, "#d9a57a");
      const bat = ctx.createLinearGradient(0, 10, 0, -62);
      bat.addColorStop(0, "#6b3f1f");
      bat.addColorStop(0.4, "#c4a574");
      bat.addColorStop(1, "#e7d3a8");
      ctx.strokeStyle = bat;
      ctx.lineWidth = 5.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 10);
      ctx.lineTo(0, -52);
      ctx.stroke();
      oval(0, 12, 3.4, 3.4, "#4a2c14");
      oval(0, -54, 4.6, 6.2, "#d6b27a");
      ctx.restore();
    }

    function drawCatcher(w, h) {
      const p = park(w, h);
      drawPerson(p.homeX + 2, p.homeY + 42, 1.18, {
        skin: "#c68642",
        number: "2",
        jersey: FIELD_JERSEY,
        crouch: 0.85,
        mask: true
      });
    }

    function drawBall(w, h) {
      if (state.phase === "pitch" && state.pitch) {
        const p = ballPos(w, h, state.t, state.pitch);
        paintSoftball(p.x, p.y, p.r);
      }
      if (state.flight && state.flight.kind !== "miss") {
        const b = flightBall(w, h);
        if (b) paintSoftball(b.x, b.y, b.r);
      }
    }

    function drawSparks(w, h) {
      state.sparks = state.sparks.filter(function (s) { return s.life > 0; });
      state.sparks.forEach(function (s) {
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 1;
        ctx.globalAlpha = Math.max(0, s.life / 24);
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x * w, s.y * h, 3, 3);
        ctx.globalAlpha = 1;
      });
    }

    function drawSmashMeter(w, h) {
      const live = state.phase === "smash" ? state.smashLive : state.smash;
      const x = w - 56;
      const top = h * 0.3;
      const barH = h * 0.46;
      const barW = 18;
      ctx.fillStyle = "rgba(15,23,42,0.72)";
      ctx.fillRect(x - 34, top - 28, 72, barH + 52);
      ctx.fillStyle = "#111827";
      ctx.fillRect(x, top, barW, barH);
      const hot = ctx.createLinearGradient(0, top + barH, 0, top);
      hot.addColorStop(0, "#334155");
      hot.addColorStop(0.45, "#f59e0b");
      hot.addColorStop(1, "#fde68a");
      ctx.fillStyle = hot;
      ctx.fillRect(x + 2, top + 2, barW - 4, barH - 4);
      ctx.fillStyle = "rgba(15,23,42,0.45)";
      ctx.fillRect(x + 2, top + 2, barW - 4, (barH - 4) * (1 - live));
      const hrY = top + (1 - HR_SMASH) * barH;
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 5, hrY);
      ctx.lineTo(x + barW + 5, hrY);
      ctx.stroke();
      ctx.fillStyle = "#fbbf24";
      ctx.font = "800 10px Space Grotesk, Inter, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("HR", x - 8, hrY + 3);
      const markerY = top + (1 - live) * barH;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.moveTo(x - 6, markerY);
      ctx.lineTo(x + barW + 8, markerY - 5);
      ctx.lineTo(x + barW + 8, markerY + 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = live >= HR_SMASH ? "#fde68a" : "#e2e8f0";
      ctx.font = "800 11px Space Grotesk, Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("SMASH", x + barW / 2, top - 10);
      ctx.fillText(String(Math.round(live * 100)), x + barW / 2, top + barH + 18);
    }

    function drawOverlay(w, h) {
      if (state.phase === "idle") {
        ctx.fillStyle = "rgba(2,6,23,0.45)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.font = "700 36px Space Grotesk, Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("CAGE CRUSH", w / 2, h / 2 - 10);
        ctx.font = "600 16px Inter, sans-serif";
        ctx.fillStyle = "#fda4af";
        ctx.fillText("Lock smash, then time the swing", w / 2, h / 2 + 22);
      }
      if (state.phase === "result" && state.feedback) {
        const boxY = h * 0.12;
        ctx.fillStyle = "rgba(2,6,23,0.62)";
        ctx.fillRect(w * 0.18, boxY, w * 0.64, 64);
        ctx.fillStyle = "#fff";
        ctx.font = "800 26px Space Grotesk, Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(state.call, w / 2, boxY + 28);
        ctx.font = "600 15px Inter, sans-serif";
        ctx.fillStyle = state.call === "WHIFF" || state.call === "TAKE" || state.call === "WEAK OUT" || state.call === "CAUGHT"
          || state.feedback.indexOf("Rolled over") !== -1 || state.feedback.indexOf("Jammed") !== -1
          ? "#fda4af"
          : state.call === "GONE" || state.feedback.indexOf("out front") !== -1
            || state.feedback.indexOf("front of the plate") !== -1 || state.feedback.indexOf("mid-plate") !== -1
            ? "#fde68a"
            : "#e2e8f0";
        ctx.fillText(state.feedback, w / 2, boxY + 50);
      }
      if (state.phase === "over") {
        ctx.fillStyle = "rgba(2,6,23,0.5)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.font = "700 34px Space Grotesk, Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("FINAL  " + state.score, w / 2, h / 2);
        ctx.font = "600 15px Inter, sans-serif";
        ctx.fillStyle = "#fbbf24";
        ctx.fillText("High  " + state.high, w / 2, h / 2 + 28);
      }
    }

    function frame(now) {
      const dt = Math.min(32, now - (state.last || now));
      state.last = now;
      if (state.phase === "smash") {
        state.smashT += (dt / 1000) * 1.35;
        state.smashLive = smashValue(state.smashT);
      }
      if (state.phase === "pitch") {
        state.t += (dt / 1000) * (0.95 * (state.pitch ? state.pitch.speed : 1));
        if (state.t >= 1.05) applyResult({ kind: "miss", label: "TAKE", pts: 0, out: true, dist: 0 }, state.t);
      }
      if (state.flight && !state.flight.caught) {
        state.flight.depth = Math.min(
          state.flight.maxDepth || 1,
          (state.flight.depth || 0) + (dt / 1000) * FLIGHT_SPEED
        );
      }
      if (state.shake > 0) state.shake -= 1;
      if (state.flash > 0) state.flash -= 1;

      const w = canvas.width;
      const h = canvas.height;
      if (state.phase === "result") checkCatch(w, h);
      ctx.save();
      if (state.shake) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
      drawField(w, h);
      drawDefense(w, h);
      drawPitcher(w, h, state.t);
      drawBall(w, h);
      drawBatter(w, h, state.phase === "result");
      drawCatcher(w, h);
      drawSparks(w, h);
      if (state.phase === "smash" || state.phase === "pitch" || state.phase === "result") drawSmashMeter(w, h);
      if (state.flash) {
        ctx.fillStyle = "rgba(254,243,199," + (state.flash / 28) + ")";
        ctx.fillRect(0, 0, w, h);
      }
      ctx.restore();
      drawOverlay(w, h);
      requestAnimationFrame(frame);
    }

    document.getElementById("play").addEventListener("click", startGame);
    document.getElementById("swing").addEventListener("click", function (event) {
      event.preventDefault();
      swing();
    });
    canvas.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      if (state.phase === "idle" || state.phase === "over") startGame();
      else swing();
    });
    window.addEventListener("keydown", function (event) {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();
        if (state.phase === "idle" || state.phase === "over") startGame();
        else swing();
      }
    });

    hud();
    renderBoard();
    loadBoard();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
